<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promii · Estimador Maestro 12 Servicios</title>
<link rel="stylesheet" href="/assets/promii-ecosystem.css">
<style>
.sow-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.9fr);gap:22px;align-items:start}
@media(max-width:960px){.sow-grid{grid-template-columns:1fr}}
.srv{border:1.5px solid var(--line-cad);border-radius:16px;padding:14px;background:#fff;margin-bottom:10px;cursor:pointer}
.srv.selected{border-color:var(--accent);background:var(--accent-soft)}
.srv-title{font-size:14px;font-weight:600;margin:4px 0}
.srv-desc{font-size:12px;color:var(--ink-soft)}
.terminal{position:sticky;top:86px;border-radius:20px;background:linear-gradient(160deg,#111720,#192230);color:#F4F7F9;padding:22px}
.term-input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;margin-bottom:8px}
.btn-sow{width:100%;padding:12px;border-radius:999px;border:1px solid #22E0C8;background:#0F9D84;color:#fff;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn-alt{width:100%;padding:10px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;margin-bottom:6px}
.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.cat-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line-cad);background:#fff;cursor:pointer;font-size:12px}
.cat-tab.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.total{font-family:Georgia,serif;font-size:26px;color:#22E0C8;margin:8px 0}
</style>
</head>
<body style="position:relative" data-vertical="growth">
<div class="prm-topbar" style="position:relative;z-index:20"><div class="prm-topbar-inner">
<a class="prm-brand" href="/servicios/"><span class="prm-dot"></span><span>COTIZADOR PROMII</span></a>
<nav class="prm-nav-links">
<a href="/servicios/">← Hub</a>
<a href="/cotizador/" class="active">Cotizador</a>
<a href="/servicios/growth.html">Growth</a>
<a href="/remodeling/">Remodeling</a>
</nav>
<div class="prm-toggles">
<div class="prm-switch-pill"><button type="button" data-lang-btn="es" class="active">ES</button><button type="button" data-lang-btn="en">EN</button></div>
<div class="prm-switch-pill"><button type="button" data-curr-btn="USD" class="active">USD</button><button type="button" data-curr-btn="COP">COP</button></div>
</div>
</div></div>
<main class="prm-container" style="position:relative;z-index:3;padding-top:28px;padding-bottom:60px">
<div class="cad-eyebrow">S-06 · 12 PRODUCTIZED SERVICES</div>
<h1 class="prm-h1">Estimador maestro · SOW en vivo</h1>
<p class="prm-lead">Selecciona servicios, aplica bundles y envía alcance por WhatsApp o email. USD ↔ COP.</p>
<div class="cat-tabs" id="cats"></div>
<div class="sow-grid">
<div id="srvList"></div>
<aside class="terminal">
<div style="font-size:11px;letter-spacing:.12em;opacity:.7;margin-bottom:8px">LIVE SOW</div>
<div class="total" id="totalLine">US$0</div>
<ul id="selList" style="list-style:none;padding:0;margin:0 0 12px;font-size:12px"></ul>
<p style="font-size:11px;opacity:.65;margin:0 0 10px">Rango estimado: <span id="rangeTotal">—</span></p>
<input class="term-input" id="cName" placeholder="Nombre *">
<input class="term-input" id="cEmail" type="email" placeholder="Email *">
<button type="button" class="btn-sow" data-hf-magnetic="0.28" onclick="send('wa')">Enviar por WhatsApp</button>
<button type="button" class="btn-alt" onclick="send('mail')">Enviar por Email</button>
<button type="button" class="btn-alt" onclick="copySOW()">Copiar SOW</button>
</aside>
</div>
<div data-promii-footer></div>
</main>
<script src="/assets/promii-ecosystem.js"></script>
<script>
const SRV=[
{id:'s01',cat:'spaces',es:'Consultoría espacial / walkthrough',en:'Spatial consult',usd:350,cop:1400000},
{id:'s02',cat:'spaces',es:'Pods BIM LOD 300–400',en:'BIM pods',usd:950,cop:3800000},
{id:'s03',cat:'spaces',es:'Scan-to-BIM / point cloud',en:'Scan-to-BIM',usd:1200,cop:4800000},
{id:'s04',cat:'spaces',es:'Set NYC DOB / FBC',en:'Code set',usd:1800,cop:7200000},
{id:'s05',cat:'growth',es:'Auditoría Growth 0–100',en:'Growth audit',usd:0,cop:0},
{id:'s06',cat:'growth',es:'Web + funnel foundation',en:'Web foundation',usd:1500,cop:6000000},
{id:'s07',cat:'growth',es:'CRM GoHighLevel / Odoo setup',en:'CRM setup',usd:900,cop:3600000},
{id:'s08',cat:'growth',es:'Automatización n8n / agents',en:'Automation',usd:1100,cop:4400000},
{id:'s09',cat:'press',es:'Libro digital o impreso',en:'Book studio',usd:590,cop:2360000},
{id:'s10',cat:'moments',es:'Video-invitación RSVP',en:'RSVP video',usd:420,cop:1680000},
{id:'s11',cat:'moments',es:'Webinar system',en:'Webinar',usd:780,cop:3120000},
{id:'s12',cat:'lab',es:'Advisory / brand lab',en:'Advisory',usd:650,cop:2600000}
];
const CATS=[{id:'all',es:'Todos'},{id:'spaces',es:'Spaces/BIM'},{id:'growth',es:'Growth'},{id:'press',es:'Press'},{id:'moments',es:'Moments'},{id:'lab',es:'Lab'}];
let selected=new Set(['s05']);
let filter='all';
const sowId='SOW-'+Date.now().toString(36).toUpperCase();
function money(u,c){
  const cur=(window.PromiiOS&&PromiiOS.getCurrency&&PromiiOS.getCurrency())||'USD';
  if(cur==='COP') return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(c);
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(u);
}
function render(){
  document.getElementById('cats').innerHTML=CATS.map(c=>`<button type="button" class="cat-tab${filter===c.id?' active':''}" onclick="filterCat('${c.id}',this)">${c.es}</button>`).join('');
  const list=SRV.filter(s=>filter==='all'||s.cat===filter);
  document.getElementById('srvList').innerHTML=list.map(s=>`<div class="srv${selected.has(s.id)?' selected':''}" onclick="toggle('${s.id}')"><div class="srv-title">${s.es}</div><div class="srv-desc">${money(s.usd,s.cop)}</div></div>`).join('');
  const rows=SRV.filter(s=>selected.has(s.id));
  let netU=rows.reduce((a,s)=>a+s.usd,0), netC=rows.reduce((a,s)=>a+s.cop,0);
  let disc=0;
  if(rows.length>=3) disc=0.08;
  if(rows.length>=5) disc=0.12;
  netU*=(1-disc); netC*=(1-disc);
  document.getElementById('totalLine').textContent=money(netU,netC);
  document.getElementById('selList').innerHTML=rows.map(r=>`<li style="display:flex;justify-content:space-between;padding:4px 0"><span>${r.es}</span><strong style="color:#22E0C8">${money(r.usd,r.cop)}</strong></li>`).join('');
  document.getElementById('rangeTotal').textContent=money(netU*0.95,netC*0.95)+' – '+money(netU*1.12,netC*1.12);
  window.__sow={rows,netU,netC,disc};
}
function toggle(id){ if(selected.has(id)){ if(selected.size>1) selected.delete(id);} else selected.add(id); render(); }
function filterCat(c,btn){ filter=c; document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }
function build(){
 const name=document.getElementById('cName').value.trim()||'Cliente';
 const email=document.getElementById('cEmail').value.trim()||'—';
 const s=window.__sow||{rows:[],netU:0,netC:0,disc:0};
 return ['PROMII SOW '+sowId,'Servicios:'].concat(s.rows.map(r=>' - '+r.es+' '+money(r.usd,r.cop))).concat(['Descuento: -'+Math.round((s.disc||0)*100)+'%','Cliente: '+name+' · '+email]).join('\n');
}
function send(ch){
 const name=document.getElementById('cName').value.trim();
 const email=document.getElementById('cEmail').value.trim();
 if(!name||!email){alert('Nombre y email son requeridos');return;}
 const t=build();
 if(window.PromiiOS){ ch==='wa'?PromiiOS.openWhatsApp(t):PromiiOS.openMail('['+sowId+'] SOW',t);}
 else if(ch==='wa') window.open('https://wa.me/573160570258?text='+encodeURIComponent(t),'_blank');
 else location.href='mailto:hi@promii.co?subject='+encodeURIComponent(sowId)+'&body='+encodeURIComponent(t);
}
function copySOW(){ navigator.clipboard&&navigator.clipboard.writeText(build()); }
(()=>{ const p=new URLSearchParams(location.search).get('preset');
 if(p==='bim'){selected.clear();selected.add('s02');selected.add('s03');}
 if(p==='growth'){selected.clear();selected.add('s05');selected.add('s07');}
 if(p==='libro'){selected.clear();selected.add('s09');}
 if(p==='eventos'){selected.clear();selected.add('s10');selected.add('s11');}
 if(window.PromiiOS) PromiiOS.initShell({});
 render();
})();
</script>
<canvas id="promii-webgl-canvas" aria-hidden="true" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0.18"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/assets/promii-hyperfluid-config.js"></script>
<script src="/assets/promii-hyperfluid-engine.js"></script>
<script>
if (window.PromiiHyperfluid) {
  PromiiHyperfluid.init({ canvasId: 'promii-webgl-canvas', ambient: true, act: 'droplet', accent: '#0F9D84', canvasOpacity: '0.18' });
}
</script>
</body>
</html>
