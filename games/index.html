<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Promii Arcade · 18 Protocols</title>
<meta name="description" content="Promii Arcade — Dreamy Vector Glass collection. 18 kinetic architecture games.">
<link rel="canonical" href="https://promii.co/games/">
<link rel="stylesheet" href="assets/promii-glass.css">
<style>
body{margin:0;background:#08080C;color:#F4F4F8;font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 100px;position:relative;z-index:1}
h1{font:700 34px Inter,system-ui;margin:8px 0;letter-spacing:-.02em}
.sub{color:rgba(244,244,248,.6);max-width:48ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.filters button{border:1px solid rgba(244,244,248,.18);background:rgba(255,255,255,.06);color:#F4F4F8;border-radius:999px;padding:8px 12px;font:600 11px Inter;cursor:pointer}
.filters button.on{background:linear-gradient(135deg,#22E0C8,#2F6BFF);color:#041018;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:block;padding:16px;border-radius:16px;border:1px solid rgba(244,244,248,.14);background:rgba(12,12,18,.75);text-decoration:none;color:inherit;cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#22E0C8}
.card b{display:block;font:700 15px Inter;margin-bottom:6px}
.card span{color:rgba(244,244,248,.62);font-size:13px}
.card i{display:block;margin-top:10px;font:600 12px Inter;font-style:normal;color:#22E0C8}
.peak{float:right;font:600 11px Inter;color:#E8B23A}
#theater{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82)}
#theater.on{display:block}
#theater iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#08080C}
#close{position:fixed;top:12px;left:12px;z-index:60;border:0;border-radius:999px;padding:10px 14px;font:700 12px Inter;background:#F4F4F8;color:#08080C;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <p style="font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#22E0C8">Promii Arcade</p>
  <h1>18 Protocols</h1>
  <p class="sub">Dreamy Vector Glass · ArchiKatz kinetic instruments. Play in theater or open standalone.</p>
  <div class="filters" id="filters">
    <button class="on" data-c="ALL">ALL (18)</button>
    <button data-c="Skill & Physics">SKILL (6)</button>
    <button data-c="Strategy & Sims">STRATEGY (4)</button>
    <button data-c="Arcade & Party">PARTY (5)</button>
    <button data-c="Originals & BIM">BIM (3)</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="theater"><button id="close" type="button">◂ HUB</button><iframe id="frame" title="game"></iframe></div>
<script src="assets/promii-core.js"></script>
<script>
const protocols = [
  {id:'01',file:'games/01_duet_glass.html',cat:'Skill & Physics',title:'01. DUET GLASS',desc:'Orbit twin glass droplets past monoliths.'},
  {id:'02',file:'games/02_resonance_keys.html',cat:'Skill & Physics',title:'02. RESONANCE KEYS',desc:'Four-lane harmonic codex.'},
  {id:'03',file:'games/03_glass_collapse.html',cat:'Skill & Physics',title:'03. GLASS COLLAPSE',desc:'Ballistic demolition with gravity.'},
  {id:'04',file:'games/04_aether_drift.html',cat:'Skill & Physics',title:'04. AETHER DRIFT',desc:'Droplet swarm through misty arches.'},
  {id:'05',file:'games/05_archi_arcana.html',cat:'Skill & Physics',title:'05. ARCHI-ARCANA',desc:'Tilt plates, synthesize thresholds.'},
  {id:'06',file:'games/06_monolith_relic.html',cat:'Skill & Physics',title:'06. MONOLITH RELIC',desc:'Route beams through prisms.'},
  {id:'07',file:'games/07_liquid_harvest.html',cat:'Strategy & Sims',title:'07. LIQUID HARVEST',desc:'Farm data crystals and lumens.'},
  {id:'08',file:'games/08_kinetic_kitchen.html',cat:'Strategy & Sims',title:'08. KINETIC KITCHEN',desc:'Photon synthesis lab.'},
  {id:'09',file:'games/09_the_archivist.html',cat:'Strategy & Sims',title:'09. THE ARCHIVIST',desc:'Sort magnetic archive volumes.'},
  {id:'10',file:'games/10_abyss_maze.html',cat:'Strategy & Sims',title:'10. ABYSS MAZE',desc:'Inertia packet navigation.'},
  {id:'11',file:'games/11_prism_racer.html',cat:'Arcade & Party',title:'11. PRISM RACER',desc:'Fiber-optic tunnel racer.'},
  {id:'12',file:'games/12_void_flyer.html',cat:'Arcade & Party',title:'12. VOID FLYER',desc:'360° vector flight defense.'},
  {id:'13',file:'games/13_illusion_finder.html',cat:'Arcade & Party',title:'13. ILLUSION FINDER',desc:'Spot the plate anomaly.'},
  {id:'14',file:'games/14_anomaly_hunt.html',cat:'Arcade & Party',title:'14. ANOMALY HUNT',desc:'Pass-and-play deduction.'},
  {id:'15',file:'games/15_chronicle_delver.html',cat:'Arcade & Party',title:'15. CHRONICLE DELVER',desc:'Explore server ruins.'},
  {id:'16',file:'games/16_slab_tower.html',cat:'Originals & BIM',title:'16. SLAB TOWER',desc:'Stack BIM slabs with balance.'},
  {id:'17',file:'games/17_clash_matrix.html',cat:'Originals & BIM',title:'17. CLASH MATRIX',desc:'Clear MEP clashes in time.'},
  {id:'18',file:'games/18_droplet_gravity.html',cat:'Originals & BIM',title:'18. DROPLET GRAVITY',desc:'N-body droplet gravity.'}
];
let cat='ALL';
const grid=document.getElementById('grid');
function peaks(){try{return PeakStore.getAllPeaks?PeakStore.getAllPeaks():PeakStore.getAll()}catch(e){return {}}}
function render(){
  const p=peaks();
  grid.innerHTML='';
  protocols.forEach(g=>{
    if(cat!=='ALL'&&g.cat!==cat) return;
    const el=document.createElement('a');
    el.className='card';
    el.href=g.file;
    const pk=p[g.id];
    el.innerHTML=(pk?`<span class="peak">PEAK ${pk}</span>`:'')+`<b>${g.title}</b><span>${g.desc}</span><i>PLAY →</i>`;
    el.onclick=e=>{e.preventDefault();openGame(g.file)};
    grid.appendChild(el);
  });
}
function openGame(src){
  document.getElementById('frame').src=src;
  document.getElementById('theater').classList.add('on');
  try{Synth.init()}catch(e){}
}
document.getElementById('close').onclick=()=>{
  document.getElementById('theater').classList.remove('on');
  document.getElementById('frame').src='about:blank';
  render();
};
document.getElementById('filters').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  cat=b.dataset.c; [...document.getElementById('filters').children].forEach(x=>x.classList.toggle('on',x===b)); render();
};
window.addEventListener('message',ev=>{
  const d=ev.data||{};
  if(d.type==='promii-peak'||d.type==='PROMII_PEAK_UPDATE') render();
  if(d.type==='PROMII_CLOSE_MODAL'){
    document.getElementById('theater').classList.remove('on');
    document.getElementById('frame').src='about:blank';
    render();
  }
});
render();
const q=new URLSearchParams(location.search);
if(q.get('protocol')){
  const g=protocols.find(x=>x.id===q.get('protocol'));
  if(g) openGame(g.file);
}
</script>
<script src="/assets/site-shell.js"></script>
</body>
</html>
