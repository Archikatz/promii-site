<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Promii Arcade · 20 Kinetic Protocols</title>
<link rel="stylesheet" href="/assets/promii-ecosystem.css">
<style>
:root{--bg:#08080C;--text:#F4F4F8;--muted:#a6a6bc;--cyan:#22E0C8;--border:rgba(244,244,248,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:28px 16px 80px}
.hero{text-align:center;margin-bottom:22px}
.hero h1{font:700 clamp(28px,5vw,44px)/1.1 Space Grotesk,system-ui;margin:0 0 8px}
.hero p{color:var(--muted);max-width:52ch;margin:0 auto}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.filter-btn{background:rgba(244,244,248,.05);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:11px;letter-spacing:1.3px}
.filter-btn.active,.filter-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(34,224,200,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{padding:18px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;transition:.2s}
.card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.card h3{margin:8px 0;font-size:15px}
.card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.badge{font-size:10px;letter-spacing:1px;color:var(--cyan)}
.card-cta{margin-top:12px;font-size:11px;font-weight:700;color:var(--cyan)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.topbar a{color:var(--cyan);text-decoration:none;font-size:12px}
#theater{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);padding:20px}
#theater.open{display:flex;flex-direction:column}
#theaterFrame{flex:1;width:100%;border:0;border-radius:12px;background:#000}
.theater-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#fff}
.btn-glass{background:rgba(244,244,248,.08);border:1px solid rgba(244,244,248,.24);color:var(--text);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:11px}
@media (prefers-reduced-motion: reduce){
  #bgCanvas{display:none !important}
  body{background:#08080C}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <div class="topbar">
    <a href="/">← PROMII</a>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="curatorAlias" placeholder="Alias" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff">
      <button class="btn-glass" type="button" onclick="document.getElementById('rateHub').classList.add('open')">RATE</button>
    </div>
  </div>
  <div class="hero">
    <h1>Promii Arcade</h1>
    <p>20 kinetic protocols — liquid glass physics, BIM originals, and party runners.</p>
  </div>
  <div class="filters">
    <button class="filter-btn active" type="button" onclick="setCat('ALL',this)">ALL</button>
    <button class="filter-btn" type="button" onclick="setCat('Skill & Physics',this)">SKILL</button>
    <button class="filter-btn" type="button" onclick="setCat('Strategy & Sims',this)">STRATEGY</button>
    <button class="filter-btn" type="button" onclick="setCat('Arcade & Party',this)">PARTY</button>
    <button class="filter-btn" type="button" onclick="setCat('Originals & BIM',this)">BIM</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="theater">
  <div class="theater-bar">
    <strong id="theaterTitle">Protocol</strong>
    <button class="btn-glass" type="button" onclick="closeTheater()">CLOSE</button>
  </div>
  <iframe id="theaterFrame" title="Game"></iframe>
</div>
<div id="rateHub" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);align-items:center;justify-content:center" class="">
  <div style="background:#12141c;padding:20px;border-radius:16px;max-width:360px;width:90%;border:1px solid var(--border)">
    <h3 style="margin-top:0">Rate the hub</h3>
    <div id="starRow" style="display:flex;gap:6px;margin:10px 0">
      <button type="button" data-s="1" class="btn-glass">1</button>
      <button type="button" data-s="2" class="btn-glass">2</button>
      <button type="button" data-s="3" class="btn-glass">3</button>
      <button type="button" data-s="4" class="btn-glass">4</button>
      <button type="button" data-s="5" class="btn-glass">5</button>
    </div>
    <textarea id="rateNote" rows="3" style="width:100%;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff"></textarea>
    <button class="btn-glass" style="width:100%;margin-top:10px" type="button" onclick="saveHubRating()">SAVE</button>
    <button class="btn-glass" style="width:100%;margin-top:6px" type="button" onclick="document.getElementById('rateHub').style.display='none'">CLOSE</button>
  </div>
</div>
<script>
document.getElementById('rateHub').classList.add=function(c){this.style.display='flex';HTMLElement.prototype.classList.add.call(this,c)};
</script>
<script src="/assets/promii-core.js"></script>
<script src="/assets/promii-logos.js"></script>
<script src="/assets/promii-arcade-hub.js"></script>
</body>
</html>
