<!DOCTYPE html>
<html lang="en">
<head>
<title>15 · Chronicle Delver | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud"><div class="brand">15 · Chronicle Delver<small>DEPTH LAYERS</small></div><div class="stats"><a class="btn" href="../index.html">◂ HUB</a><span>SCORE <strong id="sc">0</strong></span><span>BEST <strong id="best">0</strong></span><button class="btn" id="mute" type="button">AUDIO</button></div></div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Tap gold artifacts to collect. Clear a layer to go deeper.</p>
<script src="../assets/promii-core.js"></script>
<script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,score=0,depth=0,artifacts=[],t=0;const scEl=document.getElementById('sc'),bestEl=document.getElementById('best');
try{bestEl.textContent=PeakStore.get('15')||0}catch(e){}
document.getElementById('mute').onclick=function(){try{Synth.toggleMute(this)}catch(e){}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function addScore(n){score+=n;scEl.textContent=score;try{PeakStore.set('15',score);bestEl.textContent=PeakStore.get('15')}catch(e){}}
function seed(){artifacts=[];for(let i=0;i<5;i++)artifacts.push({x:Math.random()*W,y:Math.random()*H*0.6+80,got:false,pulse:Math.random()*6})}
function frame(){requestAnimationFrame(frame);t+=1/60;ctx.fillStyle='rgba(5,5,10,.28)';ctx.fillRect(0,0,W,H);
for(let i=0;i<4;i++){const y=H*0.25+i*40+Math.sin(t+i)*4;ctx.strokeStyle=`rgba(34,224,200,${0.08+i*0.03})`;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='rgba(244,244,248,.5)';ctx.font='600 12px Inter';ctx.fillText('DEPTH '+(depth|0),16,56);
artifacts.forEach(a=>{if(a.got)return;a.pulse+=0.05;const r=10+Math.sin(a.pulse)*2;const g=ctx.createRadialGradient(a.x,a.y,2,a.x,a.y,r+6);g.addColorStop(0,'rgba(232,178,58,.7)');g.addColorStop(1,'rgba(232,178,58,0)');ctx.beginPath();ctx.arc(a.x,a.y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill()});
if(artifacts.every(a=>a.got)){depth+=1;addScore(30);seed();try{Synth.note(6,.12)}catch(e){}}}
canvas.addEventListener('pointerdown',e=>{try{Synth.init()}catch(err){}artifacts.forEach(a=>{if(a.got)return;if(Math.hypot(e.clientX-a.x,e.clientY-a.y)<20){a.got=true;addScore(10);try{Synth.note(3,.08)}catch(err){}}})});
addEventListener('resize',resize);resize();seed();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
