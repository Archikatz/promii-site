<!DOCTYPE html>
<html lang="en">
<head>
<title>10 · Abyss Maze | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud"><div class="brand">10 · Abyss Maze<small>PATHFIND</small></div><div class="stats"><a class="btn" href="../index.html">◂ HUB</a><span>SCORE <strong id="sc">0</strong></span><span>BEST <strong id="best">0</strong></span><button class="btn" id="mute" type="button">AUDIO</button></div></div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Swipe or arrow keys. Reach the cyan exit; avoid crimson walls.</p>
<script src="../assets/promii-core.js"></script>
<script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,score=0;const scEl=document.getElementById('sc'),bestEl=document.getElementById('best');
try{bestEl.textContent=PeakStore.get('10')||0}catch(e){}
document.getElementById('mute').onclick=function(){try{Synth.toggleMute(this)}catch(e){}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function addScore(n){score+=n;scEl.textContent=score;try{PeakStore.set('10',score);bestEl.textContent=PeakStore.get('10')}catch(e){}}
const cols=11,rows=15;let grid=[],px=1,py=1,exit={x:0,y:0};
function gen(){grid=Array.from({length:rows},()=>Array(cols).fill(1));
function carve(x,y){grid[y][x]=0;const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);dirs.forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(ny>0&&ny<rows-1&&nx>0&&nx<cols-1&&grid[ny][nx]===1){grid[y+dy/2][x+dx/2]=0;carve(nx,ny)}})}
carve(1,1);px=1;py=1;let best=0;exit={x:1,y:1};for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++)if(grid[y][x]===0){const d=Math.abs(x-1)+Math.abs(y-1);if(d>best){best=d;exit={x,y}}}}
function cell(){const s=Math.min((W-20)/cols,(H-100)/rows);return{s,ox:(W-cols*s)/2,oy:70}}
function frame(){requestAnimationFrame(frame);ctx.fillStyle='rgba(5,5,10,.35)';ctx.fillRect(0,0,W,H);const{s,ox,oy}=cell();
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(grid[y][x]){ctx.fillStyle='rgba(255,59,48,.25)';ctx.fillRect(ox+x*s,oy+y*s,s-1,s-1)}else{ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(ox+x*s,oy+y*s,s-1,s-1)}}
ctx.fillStyle='rgba(34,224,200,.45)';ctx.fillRect(ox+exit.x*s,oy+exit.y*s,s-1,s-1);
ctx.beginPath();ctx.arc(ox+(px+.5)*s,oy+(py+.5)*s,s*0.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();
if(px===exit.x&&py===exit.y){addScore(40);try{Synth.note(7,.15)}catch(e){}gen()}}
function move(dx,dy){const nx=px+dx,ny=py+dy;if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&grid[ny][nx]===0){px=nx;py=ny;try{Synth.note(1,.04)}catch(e){}}}
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1);if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0)});
let sx,sy;canvas.addEventListener('pointerdown',e=>{try{Synth.init()}catch(err){}sx=e.clientX;sy=e.clientY});
canvas.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>20)move(dx>0?1:-1,0);else if(Math.abs(dy)>20)move(0,dy>0?1:-1);sx=sy=null});
addEventListener('resize',resize);resize();gen();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
