<!DOCTYPE html>
<html lang="en">
<head>
<title>05 · Archi-Arcana | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);letter-spacing:.14em;margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px/1.45 Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud"><div class="brand">05 · Archi-Arcana<small>THRESHOLD SYNTH</small></div><div class="stats"><a class="btn" href="../index.html">◂ HUB</a><span>SCORE <strong id="sc">0</strong></span><span>BEST <strong id="best">0</strong></span><button class="btn" id="mute" type="button">AUDIO</button></div></div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Tap up to 3 matching plates (same symbol) to synthesize.</p>
<script src="../assets/promii-core.js"></script>
<script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,score=0;const scEl=document.getElementById('sc'),bestEl=document.getElementById('best');
try{bestEl.textContent=PeakStore.get('05')||0}catch(e){}
document.getElementById('mute').onclick=function(){try{Synth.toggleMute(this)}catch(e){}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function addScore(n){score+=n;scEl.textContent=score;try{PeakStore.set('05',score);bestEl.textContent=PeakStore.get('05')}catch(e){}}
const suits=['◆','▲','●','■'];let plates=[],selected=[];
function seed(){plates=[];for(let i=0;i<6;i++)plates.push({suit:Math.floor(Math.random()*4),x:0,y:0,on:false,pulse:Math.random()*6})}
function layout(){const R=Math.min(W,H)*0.28,cx=W/2,cy=H*0.48;plates.forEach((p,i)=>{const a=-Math.PI/2+i*(Math.PI*2/6);p.x=cx+Math.cos(a)*R;p.y=cy+Math.sin(a)*R})}
function frame(){requestAnimationFrame(frame);ctx.fillStyle='rgba(5,5,10,.28)';ctx.fillRect(0,0,W,H);layout();
plates.forEach(p=>{p.pulse+=0.04;const r=28+Math.sin(p.pulse)*2;const g=ctx.createRadialGradient(p.x-6,p.y-6,2,p.x,p.y,r);g.addColorStop(0,p.on?'rgba(34,224,200,.7)':'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(34,224,200,0)');ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=p.on?'#22E0C8':'rgba(244,244,248,.25)';ctx.stroke();ctx.fillStyle='#F4F4F8';ctx.font='700 16px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(suits[p.suit],p.x,p.y+1)})}
canvas.addEventListener('pointerdown',e=>{try{Synth.init()}catch(err){}
plates.forEach(p=>{if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<34){p.on=!p.on;if(p.on)selected.push(p);else selected=selected.filter(x=>x!==p);
if(selected.length===3){const ok=selected.every(x=>x.suit===selected[0].suit);if(ok){addScore(40);try{Synth.note(6,.15)}catch(err){}}else try{Synth.noise(.12,.1)}catch(err){}
plates.forEach(x=>x.on=false);selected=[];setTimeout(seed,200)}}})});
addEventListener('resize',resize);resize();seed();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
