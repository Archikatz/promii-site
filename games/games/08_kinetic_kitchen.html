<!DOCTYPE html>
<html lang="en">
<head>
<title>08 · Kinetic Kitchen | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud"><div class="brand">08 · Kinetic Kitchen<small>ORDER CHAIN</small></div><div class="stats"><a class="btn" href="../index.html">◂ HUB</a><span>SCORE <strong id="sc">0</strong></span><span>BEST <strong id="best">0</strong></span><button class="btn" id="mute" type="button">AUDIO</button></div></div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Tap ingredients in the order shown before the timer runs out.</p>
<script src="../assets/promii-core.js"></script>
<script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,score=0;const scEl=document.getElementById('sc'),bestEl=document.getElementById('best');
try{bestEl.textContent=PeakStore.get('08')||0}catch(e){}
document.getElementById('mute').onclick=function(){try{Synth.toggleMute(this)}catch(e){}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function addScore(n){score+=n;scEl.textContent=score;try{PeakStore.set('08',score);bestEl.textContent=PeakStore.get('08')}catch(e){}}
let order=[],pan=[],timer=8,state='cook';const pool=['A','B','C','D'];
function reset(){pan=[];timer=8;state='cook';order=pool.slice(0,3).sort(()=>Math.random()-0.5)}
function frame(){requestAnimationFrame(frame);if(state==='cook')timer-=1/60;ctx.fillStyle='rgba(5,5,10,.28)';ctx.fillRect(0,0,W,H);
ctx.beginPath();ctx.ellipse(W/2,H*0.55,Math.min(120,W*0.35),50,0,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();ctx.strokeStyle='rgba(34,224,200,.35)';ctx.stroke();
ctx.fillStyle='rgba(244,244,248,.5)';ctx.font='600 12px Inter';ctx.textAlign='center';ctx.fillText('ORDER: '+order.join(' → '),W/2,H*0.28);ctx.fillText('TIME '+Math.max(0,timer).toFixed(1)+'s',W/2,H*0.34);
pool.forEach((ing,i)=>{const x=W*0.2+i*W*0.2,y=H*0.78;ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fillStyle='rgba(47,107,255,.35)';ctx.fill();ctx.strokeStyle='rgba(244,244,248,.3)';ctx.stroke();ctx.fillStyle='#F4F4F8';ctx.font='700 14px Inter';ctx.fillText(ing,x,y+5)});
pan.forEach((ing,i)=>{ctx.fillStyle='#22E0C8';ctx.font='700 14px Inter';ctx.fillText(ing,W/2-40+i*30,H*0.55+5)});
if(state==='cook'&&timer<=0){state='fail';try{Synth.noise(.2,.12)}catch(e){}setTimeout(()=>{score=0;scEl.textContent=0;reset()},900)}}
canvas.addEventListener('pointerdown',e=>{try{Synth.init()}catch(err){}if(state!=='cook')return;
pool.forEach((ing,i)=>{const x=W*0.2+i*W*0.2,y=H*0.78;if(Math.hypot(e.clientX-x,e.clientY-y)<28){pan.push(ing);if(pan.length===order.length){const ok=pan.every((v,j)=>v===order[j]);if(ok){addScore(25);try{Synth.note(6,.12)}catch(err){}reset()}else{state='fail';try{Synth.noise(.15,.1)}catch(err){}setTimeout(()=>{score=0;scEl.textContent=0;reset()},800)}}}})});
addEventListener('resize',resize);resize();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
