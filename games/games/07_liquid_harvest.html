<!DOCTYPE html>
<html lang="en">
<head>
<title>07 · Liquid Harvest | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud"><div class="brand">07 · Liquid Harvest<small>DATA FARM</small></div><div class="stats"><a class="btn" href="../index.html">◂ HUB</a><span>SCORE <strong id="sc">0</strong></span><span>BEST <strong id="best">0</strong></span><button class="btn" id="mute" type="button">AUDIO</button></div></div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Tap empty plots to seed. Tap gold crystals to harvest.</p>
<script src="../assets/promii-core.js"></script>
<script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,score=0,plots=[];const scEl=document.getElementById('sc'),bestEl=document.getElementById('best');
try{bestEl.textContent=PeakStore.get('07')||0}catch(e){}
document.getElementById('mute').onclick=function(){try{Synth.toggleMute(this)}catch(e){}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function addScore(n){score+=n;scEl.textContent=score;try{PeakStore.set('07',score);bestEl.textContent=PeakStore.get('07')}catch(e){}}
function seed(){plots=[];for(let i=0;i<12;i++)plots.push({stage:0,timer:0})}
function layout(){const cols=4,rows=3,pad=24,top=80;const bw=(W-pad*2)/cols,bh=(H-top-90)/rows;plots.forEach((p,i)=>{const c=i%cols,r=Math.floor(i/cols);p.x=pad+c*bw+8;p.y=top+r*bh+8;p.w=bw-16;p.h=bh-16})}
function frame(){requestAnimationFrame(frame);ctx.fillStyle='rgba(5,5,10,.28)';ctx.fillRect(0,0,W,H);layout();
plots.forEach(p=>{if(p.stage>0&&p.stage<3){p.timer+=1/60;if(p.timer>2.2){p.stage++;p.timer=0}}
const cols=['rgba(255,255,255,.06)','rgba(47,107,255,.25)','rgba(34,224,200,.35)','rgba(232,178,58,.45)'];
ctx.fillStyle=cols[p.stage];ctx.strokeStyle='rgba(244,244,248,.15)';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeRect(p.x,p.y,p.w,p.h);
if(p.stage===3){ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,10,0,Math.PI*2);ctx.fillStyle='rgba(232,178,58,.7)';ctx.fill()}})}
canvas.addEventListener('pointerdown',e=>{try{Synth.init()}catch(err){}
plots.forEach(p=>{if(e.clientX>=p.x&&e.clientX<=p.x+p.w&&e.clientY>=p.y&&e.clientY<=p.y+p.h){
if(p.stage===0){p.stage=1;p.timer=0;try{Synth.note(2,.08)}catch(err){}}
else if(p.stage===3){p.stage=0;addScore(20);try{Synth.note(6,.12)}catch(err){}}}})});
addEventListener('resize',resize);resize();seed();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
