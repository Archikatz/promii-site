<!DOCTYPE html>
<html lang="en">
<head>
<title>04 · Aether Drift | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--blue:#2F6BFF;--crimson:#FF3B30;--gold:#E8B23A;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);letter-spacing:.14em;margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px/1.45 Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud">
  <div class="brand">04 · Aether Drift<small>MIST SWARM</small></div>
  <div class="stats">
    <a class="btn btn-back-hub" href="../index.html">◂ HUB</a>
    <span>SCORE <strong id="sc">0</strong></span>
    <span>BEST <strong id="best">0</strong></span>
    <button class="btn" id="mute" type="button">AUDIO</button>
  </div>
</div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Hold touch / Space to thrust. Drift through arches. Move finger sideways to steer.</p>
<script src="../assets/promii-core.js"></script>
<script>
(() => {
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  let W,H,dpr,score=0;
  const scEl=document.getElementById('sc'), bestEl=document.getElementById('best');
  try{bestEl.textContent=PeakStore.get('04')||0}catch(e){}
  document.getElementById('mute').onclick=function(){try{Synth.toggleMute(this)}catch(e){}};
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function addScore(n){
    score+=n; scEl.textContent=score;
    try{PeakStore.set('04',score);bestEl.textContent=PeakStore.get('04')}catch(e){}
  }
  let drops=[], arches=[], thrust=false, t=0;
  function seed(){
    drops=[{x:W/2,y:H*0.8,vx:0,vy:0,r:12}];
    arches=[];
    for(let i=0;i<8;i++) arches.push({x:Math.random()*W,y:Math.random()*H*0.5,w:40+Math.random()*50,passed:false});
  }
  function frame(){
    requestAnimationFrame(frame); t+=1/60;
    ctx.fillStyle='rgba(5,5,10,.25)'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<6;i++){
      const x=(t*20+i*120)%(W+100)-50;
      const g=ctx.createRadialGradient(x,H*0.3,10,x,H*0.3,80);
      g.addColorStop(0,'rgba(47,107,255,.06)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(x-80,H*0.1,160,200);
    }
    arches.forEach(a=>{
      a.y+=1.2+t*0.01;
      if(a.y>H+40){a.y=-40;a.x=Math.random()*W;a.passed=false}
      ctx.strokeStyle='rgba(244,244,248,.2)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(a.x,a.y,a.w,Math.PI,0); ctx.stroke();
      ctx.strokeStyle='rgba(34,224,200,.25)'; ctx.beginPath(); ctx.arc(a.x,a.y,a.w-6,Math.PI,0); ctx.stroke();
    });
    const d=drops[0];
    if(thrust){d.vy-=0.35}
    d.vy+=0.18; d.vx*=0.98; d.x+=d.vx; d.y+=d.vy;
    if(d.x<20){d.x=20;d.vx*=-0.5} if(d.x>W-20){d.x=W-20;d.vx*=-0.5}
    if(d.y>H-20){d.y=H-20;d.vy*=-0.3}
    if(d.y<20){d.y=20;d.vy*=-0.3}
    const g=ctx.createRadialGradient(d.x-4,d.y-5,2,d.x,d.y,d.r);
    g.addColorStop(0,'rgba(255,255,255,.65)'); g.addColorStop(.4,'rgba(34,224,200,.5)'); g.addColorStop(1,'rgba(34,224,200,0)');
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    arches.forEach(a=>{
      if(!a.passed && Math.abs(d.y-a.y)<12 && Math.abs(d.x-a.x)<a.w-8){
        a.passed=true; addScore(15); try{Synth.note(5,.12)}catch(e){}
        if(drops.length<5 && Math.random()<.3) drops.push({x:d.x+10,y:d.y,vx:1,vy:-1,r:8});
      }
    });
    for(let i=1;i<drops.length;i++){
      const e=drops[i]; e.vy+=0.15; e.x+=e.vx; e.y+=e.vy;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
      ctx.fillStyle='rgba(34,224,200,.35)';ctx.fill();
    }
  }
  canvas.addEventListener('pointerdown',()=>{thrust=true;try{Synth.init()}catch(e){}});
  canvas.addEventListener('pointerup',()=>thrust=false);
  addEventListener('keydown',e=>{if(e.code==='Space')thrust=true});
  addEventListener('keyup',e=>{if(e.code==='Space')thrust=false});
  canvas.addEventListener('pointermove',e=>{ if(drops[0]) drops[0].vx+=(e.movementX||0)*0.05; });
  addEventListener('resize', ()=>{resize();seed()});
  resize(); seed(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
