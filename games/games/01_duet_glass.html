<!DOCTYPE html>
<html lang="en">
<head>
<title>01 · DUET GLASS | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--blue:#2F6BFF;--crimson:#FF3B30;--gold:#E8B23A;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);letter-spacing:.14em;margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px/1.45 Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud">
  <div class="brand">01 · Duet Glass<small>ORBITAL PAIR</small></div>
  <div class="stats">
    <a class="btn btn-back-hub" href="../index.html">◂ HUB</a>
    <span>SCORE <strong id="sc">0</strong></span>
    <span>BEST <strong id="best">0</strong></span>
    <button class="btn" id="mute" type="button">AUDIO</button>
  </div>
</div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Drag / ← → to rotate the pair. Keep both droplets clear of monoliths. Near-misses boost score. Survive the pulse waves.</p>
<script src="../assets/promii-core.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, dpr, running = true, score = 0, t = 0, rot = 0, rotV = 0;
  const bestEl = document.getElementById('best');
  const scEl = document.getElementById('sc');
  try { bestEl.textContent = PeakStore.get('01') || 0; } catch(e) {}
  document.getElementById('mute').onclick = function(){ try{Synth.toggleMute(this)}catch(e){} };
  const pair = { r: 52, a: 0, dr: 14 };
  let monoliths = [];
  let particles = [];
  let pulse = 0;
  function resize(){
    dpr = Math.min(devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function spawnMonoliths(){
    monoliths = [];
    for (let i=0;i<7;i++){
      monoliths.push({
        x: Math.random()*W, y: Math.random()*H,
        w: 18+Math.random()*28, h: 60+Math.random()*100,
        vx: (Math.random()-.5)*.4, vy: (Math.random()-.5)*.4,
        phase: Math.random()*Math.PI*2
      });
    }
  }
  function drops(){
    const cx = W/2, cy = H/2;
    const a = pair.a + rot;
    return [
      { x: cx + Math.cos(a)*pair.r, y: cy + Math.sin(a)*pair.r },
      { x: cx + Math.cos(a+Math.PI)*pair.r, y: cy + Math.sin(a+Math.PI)*pair.r }
    ];
  }
  function drawGlassOrb(x,y,r,hue){
    const g = ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,.55)');
    g.addColorStop(.35,`hsla(${hue},80%,65%,.55)`);
    g.addColorStop(.75,`hsla(${hue},70%,40%,.25)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(x-r*.25,y-r*.3,r*.28,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${hue},80%,70%,.5)`; ctx.lineWidth=1.5; ctx.stroke();
  }
  function hit(){
    try{Synth.noise(.2,.15)}catch(e){}
    running=false;
    try{ PeakStore.set('01', score); bestEl.textContent = PeakStore.get('01'); }catch(e){}
    setTimeout(()=>{ score=0; scEl.textContent=0; rot=0; rotV=0; pair.a=0; spawnMonoliths(); particles=[]; running=true; }, 900);
  }
  function frame(now){
    requestAnimationFrame(frame);
    if (!W) return;
    t += 1/60;
    ctx.fillStyle='rgba(5,5,10,.28)'; ctx.fillRect(0,0,W,H);
    const bg = ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,Math.max(W,H)*.7);
    bg.addColorStop(0,'rgba(34,224,200,.03)'); bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    rot += rotV; rotV *= .94;
    pair.a += .01;
    pair.r = 48 + Math.sin(t*1.4)*6;
    monoliths.forEach(m=>{
      m.x += m.vx; m.y += m.vy; m.phase += .02;
      if (m.x<0||m.x>W) m.vx*=-1;
      if (m.y<0||m.y>H) m.vy*=-1;
      const sway = Math.sin(m.phase)*4;
      ctx.save(); ctx.translate(m.x, m.y+sway);
      ctx.fillStyle='rgba(20,24,36,.85)'; ctx.strokeStyle='rgba(244,244,248,.18)'; ctx.lineWidth=1;
      ctx.fillRect(-m.w/2,-m.h/2,m.w,m.h); ctx.strokeRect(-m.w/2,-m.h/2,m.w,m.h);
      ctx.fillStyle='rgba(34,224,200,.12)'; ctx.fillRect(-m.w/2,-m.h/2,m.w,6);
      ctx.restore();
    });
    const ds = drops();
    ctx.beginPath(); ctx.moveTo(ds[0].x,ds[0].y); ctx.lineTo(ds[1].x,ds[1].y);
    ctx.strokeStyle='rgba(34,224,200,.25)'; ctx.lineWidth=2; ctx.stroke();
    drawGlassOrb(ds[0].x,ds[0].y,pair.dr,168);
    drawGlassOrb(ds[1].x,ds[1].y,pair.dr,210);
    if (running){
      ds.forEach(d=>{
        monoliths.forEach(m=>{
          const near = Math.abs(d.x-m.x) < m.w/2+pair.dr+10 && Math.abs(d.y-m.y) < m.h/2+pair.dr+10;
          const hitBox = Math.abs(d.x-m.x) < m.w/2+pair.dr*.7 && Math.abs(d.y-m.y) < m.h/2+pair.dr*.7;
          if (hitBox) hit();
          else if (near) {
            score += 1; scEl.textContent = score;
            particles.push({x:d.x,y:d.y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:1,hue:168});
          }
        });
      });
      if (Math.random() < .02) score += 1, scEl.textContent = score;
    }
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.life-=.03;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5*p.life,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},80%,60%,${p.life})`; ctx.fill();
    });
    pulse = (pulse + .008) % 1;
    ctx.beginPath(); ctx.arc(W/2,H/2,40+pulse*Math.min(W,H)*.45,0,Math.PI*2);
    ctx.strokeStyle=`rgba(47,107,255,${.15*(1-pulse)})`; ctx.lineWidth=2; ctx.stroke();
  }
  let dragging=false, lastX=0;
  canvas.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; try{Synth.init()}catch(err){} });
  canvas.addEventListener('pointermove', e=>{ if(!dragging)return; rotV += (e.clientX-lastX)*0.003; lastX=e.clientX; });
  canvas.addEventListener('pointerup', ()=> dragging=false);
  addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft'||e.key==='a') rotV -= .04;
    if(e.key==='ArrowRight'||e.key==='d') rotV += .04;
  });
  addEventListener('resize', resize);
  resize(); spawnMonoliths(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
