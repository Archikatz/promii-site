<!DOCTYPE html>
<html lang="en">
<head>
<title>13 · ILLUSION FINDER | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--panel:rgba(244,244,248,.06);--border:rgba(244,244,248,.16);--text:#F4F4F8;--muted:rgba(244,244,248,.55);--cyan:#22E0C8;--crimson:#FF3B30;--blue:#2F6BFF}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;touch-action:none}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.12em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);letter-spacing:.16em;margin-top:2px}
.stats{display:flex;gap:10px;align-items:center;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 12px 90px;gap:18px}
.plates{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;perspective:900px}
.plate{display:grid;grid-template-columns:repeat(4,minmax(48px,56px));gap:8px;padding:14px;border-radius:18px;background:rgba(12,12,18,.7);border:1px solid var(--border);backdrop-filter:blur(14px);transform-style:preserve-3d;animation:plateSway 4.5s ease-in-out infinite}
.plate.right{animation-delay:-2.2s}
@keyframes plateSway{0%,100%{transform:rotateY(-8deg) rotateX(4deg)}50%{transform:rotateY(8deg) rotateX(-3deg)}}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid rgba(244,244,248,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.03);transition:transform .15s,box-shadow .15s}
.cell:hover{transform:scale(1.06);box-shadow:0 0 18px rgba(34,224,200,.25)}
.glyph{width:42%;height:42%;border:2.5px solid var(--c,#22E0C8);border-radius:3px;animation:spin var(--sp,3.2s) linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.92));font:500 12.5px/1.45 Inter;color:var(--muted)}
.hint strong{color:var(--cyan);font-weight:600}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle at center,rgba(255,59,48,.2),transparent 55%);opacity:0;transition:opacity .2s}
.flash.on{opacity:1}
.okflash{background:radial-gradient(circle at center,rgba(34,224,200,.18),transparent 55%)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>
<div class="hud">
  <div class="brand">13 · Illusion Finder<small>CURATORIAL AUDIT</small></div>
  <div class="stats">
    <a class="btn btn-back-hub" href="../index.html">◂ HUB</a>
    <span>AUDITED <strong id="score">0</strong></span>
    <button class="btn" type="button" id="muteBtn">AUDIO: ON</button>
  </div>
</div>
<div class="stage">
  <div class="plates">
    <div class="plate" id="leftPlate"></div>
    <div class="plate right" id="rightPlate"></div>
  </div>
</div>
<p class="hint"><strong>How to play:</strong> Two plates should match. One cell is wrong (color or spin). Tap the anomaly on the right plate. Motions are intentional — trust the mismatch, not the dizziness.</p>
<script src="../assets/promii-core.js"></script>
<script>
(() => {
  const c = document.getElementById('fx'), ctx = c.getContext('2d');
  let w, h, dpr, dots = [];
  function resize(){
    dpr = Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
    c.width=w*dpr; c.height=h*dpr; c.style.width=w+'px'; c.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dots = Array.from({length:40},()=>({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2.5,v:.2+Math.random()*.6}));
  }
  function frame(){
    ctx.fillStyle='rgba(5,5,10,.35)'; ctx.fillRect(0,0,w,h);
    dots.forEach(d=>{
      d.y += d.v; if(d.y>h+4){d.y=-4;d.x=Math.random()*w}
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle='rgba(34,224,200,.15)'; ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  addEventListener('resize',resize); resize(); frame();
})();

let score = 0, anomalyIdx = 0;
const scoreEl = document.getElementById('score');
const flash = document.getElementById('flash');
document.getElementById('muteBtn').onclick = function(){ Synth.toggleMute(this); };

function shapesFor(i, col){
  const sp = (2.4 + (i%5)*0.35) + 's';
  const rot = (i*37)%360;
  return `<div class="glyph" style="--c:${col};--sp:${sp};border-radius:${i%3===0?'50%':i%3===1?'3px':'8px'};transform:rotate(${rot}deg)"></div>`;
}

function newAudit(){
  const baseCols = Array.from({length:16}, (_,i) => Math.random()>.45 ? '#22E0C8' : (Math.random()>.5?'#F4F4F8':'#2F6BFF'));
  anomalyIdx = Math.floor(Math.random()*16);
  const rightCols = baseCols.slice();
  rightCols[anomalyIdx] = '#FF3B30';

  ['leftPlate','rightPlate'].forEach((id, side) => {
    const el = document.getElementById(id); el.innerHTML = '';
    const arr = side===0 ? baseCols : rightCols;
    arr.forEach((col, i) => {
      const d = document.createElement('div');
      d.className = 'cell';
      d.innerHTML = shapesFor(i, col);
      if (side===1 && i===anomalyIdx) {
        const g = d.querySelector('.glyph');
        if (g) { g.style.animationDirection = 'reverse'; g.style.animationDuration = '1.1s'; }
      }
      d.onclick = () => {
        try { Synth.init(); } catch(e) {}
        if (i === anomalyIdx) {
          score++; scoreEl.textContent = score;
          try { PeakStore.set('13', score); } catch(e) {}
          try { Synth.note(6, 0.22); } catch(e) {}
          flash.className = 'flash okflash on';
          setTimeout(()=>{ flash.className='flash'; newAudit(); }, 180);
        } else {
          try { Synth.noise(0.14, 0.12); } catch(e) {}
          flash.className = 'flash on';
          setTimeout(()=> flash.className='flash', 160);
        }
      };
      el.appendChild(d);
    });
  });
}
newAudit();
</script>
</body>
</html>
