<!DOCTYPE html>
<html lang="en">
<head>
<title>14 · Anomaly Hunt | Promii Arcade</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="../assets/promii-glass.css">
<style>
:root{--bg:#05050a;--cyan:#22E0C8;--text:#F4F4F8;--muted:rgba(244,244,248,.55);--border:rgba(244,244,248,.16)}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(8,8,14,.72);border:1px solid var(--border);backdrop-filter:blur(16px)}
.brand{font:700 13px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.brand small{display:block;font:600 10px Inter;color:var(--cyan);margin-top:2px}
.stats{display:flex;gap:8px;align-items:center;font:600 12px Inter}
.btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:10px;cursor:pointer;font:600 11px Inter;text-decoration:none}
.hint{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 16px 18px;text-align:center;background:linear-gradient(transparent,rgba(5,5,10,.94));font:500 12.5px Inter;color:var(--muted)}
.hint strong{color:var(--cyan)}
</style>
</head>
<body>
<div class="hud"><div class="brand">14 · Anomaly Hunt<small>SCAN FIELD</small></div><div class="stats"><a class="btn" href="../index.html">◂ HUB</a><span>SCORE <strong id="sc">0</strong></span><span>BEST <strong id="best">0</strong></span><button class="btn" id="mute" type="button">AUDIO</button></div></div>
<canvas id="c"></canvas>
<p class="hint"><strong>How to play:</strong> Tap red anomalies before they fade. Faster hits score more.</p>
<script src="../assets/promii-core.js"></script>
<script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,score=0,anomalies=[];const scEl=document.getElementById('sc'),bestEl=document.getElementById('best');
try{bestEl.textContent=PeakStore.get('14')||0}catch(e){}
document.getElementById('mute').onclick=function(){try{Synth.toggleMute(this)}catch(e){}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function addScore(n){score+=n;scEl.textContent=score;try{PeakStore.set('14',score);bestEl.textContent=PeakStore.get('14')}catch(e){}}
function spawn(){anomalies.push({x:Math.random()*W,y:Math.random()*H*0.7+60,life:2.5+Math.random(),r:12+Math.random()*10,hit:false})}
function frame(){requestAnimationFrame(frame);ctx.fillStyle='rgba(5,5,10,.3)';ctx.fillRect(0,0,W,H);if(Math.random()<0.04)spawn();
anomalies=anomalies.filter(a=>a.life>0&&!a.dead);anomalies.forEach(a=>{a.life-=1/60;const alpha=Math.min(1,a.life);const g=ctx.createRadialGradient(a.x,a.y,2,a.x,a.y,a.r);g.addColorStop(0,`rgba(255,59,48,${0.6*alpha})`);g.addColorStop(1,'rgba(255,59,48,0)');ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=`rgba(244,244,248,${0.3*alpha})`;ctx.stroke()})}
canvas.addEventListener('pointerdown',e=>{try{Synth.init()}catch(err){}anomalies.forEach(a=>{if(a.hit)return;if(Math.hypot(e.clientX-a.x,e.clientY-a.y)<a.r+8){a.hit=true;a.dead=true;addScore(15+Math.floor(a.life*5));try{Synth.note(4,.1)}catch(err){}}})});
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
