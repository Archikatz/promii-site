<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('promii-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libro · ArchiKatz Editorial</title>
<meta name="description" content="Fractalia y Psicodelia — texto íntegro del manuscrito PDF.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37}html[data-theme="dark"]{--bg:#0a0a0f;--fg:#f2efe6;--card:#12121a;--line:rgba(255,255,255,.1);--muted:#9a9688}html[data-theme="light"]{--bg:#f4f0e6;--fg:#16140f;--card:#fff;--line:rgba(0,0,0,.08);--muted:#6a6658}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 Inter,system-ui}.wrap{max-width:720px;margin:0 auto;padding:28px 18px 110px}
.kicker{font:600 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}h1{font:700 clamp(30px,5.5vw,46px)/1.1 "Playfair Display",serif}
.sub{color:var(--muted);font-size:15px}.tagline{font:italic 600 18px "Playfair Display",serif;color:var(--gold);margin:18px 0}
.chip{display:inline-flex;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font:600 12px Inter;color:inherit;text-decoration:none;margin:4px}.chip.on{background:var(--gold);color:#1a1408;border:0}
.toc{list-style:none;padding:0;margin:24px 0;display:grid;gap:8px}.toc a{display:flex;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none;font-size:14px}.toc span{color:var(--gold);font-weight:700}
.ch{margin:52px 0;padding-top:12px;border-top:1px solid var(--line)}.ch h2{font:700 22px "Playfair Display",serif}.art{margin:10px 0 16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#07070c;aspect-ratio:16/10}.art svg{display:block;width:100%;height:100%}.body{white-space:pre-wrap}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
</style></head><body>
<main class="wrap">
<p class="kicker" id="kicker">ArchiKatz Editorial · Tomo I</p>
<h1 id="title">…</h1>
<p class="sub" id="subtitle"></p>
<p class="tagline" id="tagline"></p>
<div class="navrow" id="switch"></div>
<ol class="toc" id="toc"></ol>
<div id="chapters"></div>
<footer><p>Texto íntegro del manuscrito PDF · Sello Archikatz · 2026 · <a href="./" style="color:inherit">Editorial</a> · <a href="proceso-creador.html" style="color:inherit">Making-of</a></p></footer>
</main>
<script src="scenes.js"></script>
<script src="/assets/site-shell.js" data-mode="full"></script>
<script src="books-loader.js"></script>
<script>
(function(){
  var ART_F={1:['canvas','#d4af37'],2:['blueprint','#4f9bff'],3:['fractal','#d4af37'],4:['city','#4f9bff'],5:['screens','#d4af37'],6:['figure','#c9a227'],7:['neon','#ff3b30'],8:['end','#d4af37']};
  var ART_P={1:['psyche','#c9a0ff'],2:['glass','#22e0c8'],3:['ink','#e8e0d0'],4:['screens','#9b6dff'],5:['fractal','#c9a0ff'],6:['city','#4f9bff'],7:['figure','#ff6b9d'],8:['end','#c9a0ff']};
  var q=(location.search.match(/[?&]libro=([^&]+)/)||[])[1]||'fractalia';q=q.toLowerCase();
  if(q!=='fractalia'&&q!=='psicodelia')q='fractalia';
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function draw(){
    var pack=(window.ARCHIKATZ_LIBROS||{})[q];
    if(!pack||!pack.chapters||!pack.chapters.length){document.getElementById('chapters').innerHTML='<p>Cargando el manuscrito…</p>';return;}
    document.title=pack.title+' · ArchiKatz Editorial';
    document.getElementById('title').textContent=pack.title;
    document.getElementById('subtitle').textContent=pack.subtitle;
    document.getElementById('tagline').textContent=pack.tagline;
    document.getElementById('kicker').textContent='ArchiKatz Editorial · Tomo I · '+pack.title;
    document.getElementById('switch').innerHTML='<a class="chip'+(q==='fractalia'?' on':'')+'" href="libro.html?libro=fractalia">Fractalia</a><a class="chip'+(q==='psicodelia'?' on':'')+'" href="libro.html?libro=psicodelia">Psicodelia</a><a class="chip" href="./">← Editorial</a><a class="chip" href="proceso-creador.html">Making-of</a>';
    var artMap=q==='fractalia'?ART_F:ART_P;
    document.getElementById('toc').innerHTML=pack.chapters.map(function(c){return '<li><a href="#cap'+c.n+'"><span>'+c.n+'</span> '+esc(c.title)+'</a></li>';}).join('');
    document.getElementById('chapters').innerHTML=pack.chapters.map(function(c){
      var a=artMap[c.n]||['canvas','#d4af37'];
      var svg=(typeof AK_SCENE==='function')?AK_SCENE(a[0],a[1],c.n*31+(q==='psicodelia'?7:0)):'';
      return '<article class="ch" id="cap'+c.n+'"><p class="kicker">Capítulo '+c.roman+'</p><div class="art">'+svg+'</div><h2>'+esc(c.title)+'</h2><div class="body">'+esc(c.body)+'</div></article>';
    }).join('');
  }
  if(window.ARCHIKATZ_BOOKS_READY) ARCHIKATZ_BOOKS_READY.then(draw).catch(draw); else draw();
})();
</script>
</body></html>
