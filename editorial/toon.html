<!doctype html>
<html lang="es" data-theme="dark" data-title-en="ArchiKatz Webtoon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webtoon ArchiKatz</title>
<meta name="description" content="Webtoon y libros ArchiKatz: Guardiana, Fractalia, Psicodelia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ak.css">
<style>
.reader{max-width:560px;margin:0 auto;padding:30px 0 10px}
.head{padding:0 max(16px,env(safe-area-inset-left));margin-bottom:22px}
.head h1{font-size:clamp(34px,8vw,52px)}
.panel{position:relative;aspect-ratio:400/520;margin:0 0 6px;overflow:hidden;background:#07070c;opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.panel.in{opacity:1;transform:none}
.panel svg,.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.panel.in svg{animation:ak-breathe 6s ease-in-out infinite}
@keyframes ak-breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}
.narr{position:absolute;left:14px;right:14px;top:14px;padding:12px 14px;background:rgba(242,239,230,.94);color:#141218;font:500 15px/1.5 Inter,system-ui;border-left:4px solid var(--a);box-shadow:0 10px 24px -12px rgba(0,0,0,.7)}
.bubble{position:absolute;left:18px;right:46px;bottom:20px;padding:14px 16px;background:rgba(247,245,239,.96);color:#121014;border-radius:20px;font:600 16px/1.4 "Space Grotesk",system-ui;box-shadow:0 14px 30px -14px rgba(0,0,0,.8)}
.bubble small{display:block;font:700 10.5px Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--a);margin-bottom:4px}
.sfx{position:absolute;left:0;right:0;top:38%;text-align:center;font:700 clamp(40px,12vw,64px)/1 "Space Grotesk",system-ui;color:var(--a);text-shadow:0 0 24px var(--a);transform:rotate(-6deg)}
.endbar{padding:26px max(16px,env(safe-area-inset-left)) 0;text-align:center}
.endbar .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.nav-eps{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nav-eps a{font:600 12px Inter;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#a6a6bc;text-decoration:none}
.nav-eps a.on{color:#f4f4f8;border-color:rgba(34,224,200,.4)}
.muted{color:#a6a6bc}
.btn{display:inline-flex;padding:10px 16px;border-radius:999px;font:600 13px Inter;text-decoration:none;border:0;cursor:pointer;background:#e8d5a3;color:#0b0b12}
.btn.ghost{background:transparent;color:#e8e8f0;border:1px solid rgba(255,255,255,.15)}
.chip{display:inline-flex;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.15);color:#a6a6bc;font:600 12px Inter;text-decoration:none}
</style>
</head>
<body>
<main class="reader" id="app"><p class="muted" style="padding:0 16px">Cargando…</p></main>
<script src="scenes.js"></script>
<script src="episodes-data.js"></script>
<script src="/assets/site-shell.js" data-mode="full"></script>
<script>
(function(){
  if(!window.PROMII_SITE){window.PROMII_SITE={L:function(x){if(!x)return'';if(typeof x==='string')return x;return x.es||x.en||'';}};} 
  var L=function(x){return PROMII_SITE.L(x);};
  var EN=function(){return document.documentElement.lang==='en';};
  var slug=new URLSearchParams(location.search).get('ep')||'ep00-la-guardiana-del-umbral';
  var EPS=null, app=document.getElementById('app');
  function esc(t){return String(t==null?'':t).replace(/&/g,'&').replace(/</g,'<');}
  function draw(){
    if(!EPS||!EPS.length){app.innerHTML='<p class="muted" style="padding:0 16px">'+(EN()?'No episodes found.':'No hay episodios.')+'</p>';return;}
    var i=EPS.findIndex(function(e){return e.slug===slug;});if(i<0)i=0;var e=EPS[i];slug=e.slug;
    document.title=L(e.title)+' · ArchiKatz';
    var nav=EPS.map(function(x){return '<a href="?ep='+encodeURIComponent(x.slug)+'" class="'+(x.slug===e.slug?'on':'')+'">'+esc(L(x.title)).slice(0,28)+'</a>';}).join('');
    var panels=e.panels.map(function(p,k){
      var t=esc(EN()?p.en:p.es);
      var scene=(typeof AK_SCENE==='function')?AK_SCENE(p.scene,p.accent,k+11):'';
      var o='<figure class="panel" data-scene="'+esc(p.scene)+'" style="--a:'+esc(p.accent)+'">'+(p.img?'<img src="'+esc(p.img)+'" alt="" loading="lazy">':scene);
      if(p.kind==='narr')o+='<div class="narr">'+t+'</div>';
      else if(p.kind==='dialog')o+='<div class="bubble"><small>'+esc(p.speaker||'')+'</small>'+t+'</div>';
      else if(p.kind==='sfx')o+='<div class="sfx">'+t+'</div>';
      else o+='<div class="narr">'+t+'</div>';
      return o+'</figure>';
    }).join('');
    app.innerHTML='<div class="head"><a class="chip" href="./" style="text-decoration:none">← Editorial</a> <a class="chip" href="/archikatz/">Universo</a><h1>'+esc(L(e.title))+'</h1><p class="muted" style="margin:0">'+(e.book?(EN()?'Special book':'Libro especial'):((EN()?'Episode ':'Episodio ')+e.n))+' · '+esc(L(e.summary))+'</p><div class="nav-eps">'+nav+'</div></div>'+panels+'<div class="endbar"><span class="muted">'+(EN()?'End of reading':'Fin de la lectura')+'</span><div class="row"><a class="btn" href="./#libros">'+(EN()?'More books':'Más libros')+'</a><button class="btn ghost" id="shareEp">'+(EN()?'Share':'Compartir')+'</button></div></div>';
    var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}});},{threshold:.12});
    app.querySelectorAll('.panel').forEach(function(p){io.observe(p);});
    setTimeout(function(){app.querySelectorAll('.panel').forEach(function(p){if(p.getBoundingClientRect().top<innerHeight)p.classList.add('in');});},50);
    var sh=document.getElementById('shareEp');
    if(sh)sh.onclick=function(){var u=location.href,t='ArchiKatz · '+L(e.title);if(navigator.share)navigator.share({title:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u);};
  }
  function use(data){if(!Array.isArray(data))throw new Error('bad');EPS=data;draw();try{addEventListener('promii:lang',draw);}catch(e){}}
  var dir=location.pathname.replace(/[^\/]*$/,'');
  var candidates=[dir+'episodes.json','episodes.json','./episodes.json','/editorial/episodes.json'];
  var tried=0;
  function tryNext(){
    if(tried>=candidates.length){
      if(window.AK_EPISODES_FALLBACK){use(window.AK_EPISODES_FALLBACK);return;}
      app.innerHTML='<p class="muted" style="padding:0 16px">'+(EN()?'Could not load episode.':'No se pudo cargar el episodio.')+' <a href="/editorial/">← Editorial</a></p>';
      return;
    }
    var url=candidates[tried++];
    fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(use).catch(tryNext);
  }
  tryNext();
})();
</script>
</body>
</html>
