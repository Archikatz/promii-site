<!doctype html>
<html lang="es" data-theme="dark" data-title-en="ArchiKatz Webtoon">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("promii-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webtoon ArchiKatz</title>
<meta name="description" content="Webtoon y libros ArchiKatz: Guardiana, Fractalia, Psicodelia.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ak.css">
<style>
.reader{max-width:560px;margin:0 auto;padding:24px 0 48px;position:relative;z-index:3}
.head{padding:0 16px 18px}
.head h1{font:700 clamp(28px,7vw,48px)/1.08 "Playfair Display",serif;margin:10px 0 6px}
.panel{position:relative;aspect-ratio:400/520;margin:0 0 8px;overflow:hidden;background:#07070c;opacity:0;transform:translateY(20px);transition:.7s ease}
.panel.in{opacity:1;transform:none}
.panel svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.narr{position:absolute;left:14px;right:14px;top:14px;padding:12px 14px;background:rgba(242,239,230,.94);color:#141218;font:500 15px/1.5 Inter,system-ui;border-left:4px solid var(--a,#e8d5a3)}
.bubble{position:absolute;left:18px;right:40px;bottom:20px;padding:14px 16px;background:rgba(247,245,239,.96);color:#121014;border-radius:18px;font:600 16px/1.4 "Space Grotesk",system-ui}
.bubble small{display:block;font:700 10px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--a,#e8d5a3);margin-bottom:4px}
.sfx{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(36px,10vw,56px) "Space Grotesk",system-ui;color:var(--a,#e8d5a3);text-shadow:0 0 20px currentColor;transform:rotate(-6deg)}
.nav-eps{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nav-eps a{font:600 12px Inter;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#a6a6bc;text-decoration:none}
.nav-eps a.on{color:#0b0b12;background:#e8d5a3;border-color:transparent}
.endbar{padding:24px 16px;text-align:center}
.btn{display:inline-flex;padding:10px 16px;border-radius:999px;font:600 13px Inter;text-decoration:none;border:0;cursor:pointer;background:#e8d5a3;color:#0b0b12;margin:4px}
.chip{display:inline-flex;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.15);color:#a6a6bc;font:600 12px Inter;text-decoration:none;margin-right:6px}
.muted{color:#9a9688;font-size:14px}
@media (prefers-reduced-motion: reduce){#promii-webgl-canvas{display:none !important}}
</style>
</head>
<body style="position:relative">
<main class="reader" id="app"><p class="muted" style="padding:16px">Cargando…</p></main>
<script src="scenes.js"></script>
<script src="/assets/site-shell.js" data-mode="full"></script>
<script src="episodes-data.js"></script>
<script>
(function(){
  var app=document.getElementById('app');
  function EN(){return document.documentElement.lang==='en'}
  function L(o){ if(!o) return ''; if(typeof o==='string') return o; return EN()?(o.en||o.es||''):(o.es||o.en||''); }
  function esc(t){ return String(t==null?'':t).replace(/&/g,'&').replace(/</g,'<'); }
  function draw(data){
    var EPS=(data&&data.episodes)||window.EPISODES||[];
    var slug=new URLSearchParams(location.search).get('ep')||'ep00-la-guardiana-del-umbral';
    if(!EPS||!EPS.length){ app.innerHTML='<p class="muted" style="padding:16px">No hay episodios.</p>'; return; }
    var e=EPS.find(function(x){return x.slug===slug})||EPS[0];
    var nav=EPS.map(function(x){return '<a href="?ep='+encodeURIComponent(x.slug)+'" class="'+(x.slug===e.slug?'on':'')+'">'+esc(L(x.title)).slice(0,30)+'</a>';}).join('');
    var panels=(e.panels||[]).map(function(p,k){
      var scene=(window.AKScenes&&AKScenes[p.scene])?AKScenes[p.scene](p):'';
      var o='<figure class="panel" style="--a:'+esc(p.accent||'#e8d5a3')+'">'+scene;
      if(p.narration) o+='<div class="narr">'+esc(L(p.narration))+'</div>';
      if(p.bubble) o+='<div class="bubble"><small>'+esc(L(p.speaker||''))+'</small>'+esc(L(p.bubble))+'</div>';
      if(p.sfx) o+='<div class="sfx">'+esc(L(p.sfx))+'</div>';
      return o+'</figure>';
    }).join('');
    var badge='<span class="chip">WEBTOON</span>';
    app.innerHTML='<div class="head">'+badge+'<a class="chip" href="./">← Editorial</a><a class="chip" href="/archikatz/">Universo</a><h1>'+esc(L(e.title))+'</h1><p class="muted">'+esc(L(e.summary))+'</p><div class="nav-eps">'+nav+'</div></div>'+panels+'<div class="endbar"><a class="btn" href="./#libros">'+(EN()?'More books':'Más libros')+'</a></div>';
    var io=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting)en.target.classList.add('in');});},{threshold:0.2});
    app.querySelectorAll('.panel').forEach(function(p){io.observe(p);});
    setTimeout(function(){app.querySelectorAll('.panel').forEach(function(p){if(p.getBoundingClientRect().top<innerHeight)p.classList.add('in');});},30);
  }
  function boot(){
    var dir=location.pathname.replace(/[^/]*$/,'');
    fetch(dir+'episodes.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(draw).catch(function(){
      fetch('/editorial/episodes.json').then(function(r){return r.json();}).then(draw).catch(function(){
        if(window.EPISODES) draw({episodes:window.EPISODES});
        else app.innerHTML='<p class="muted" style="padding:16px">No se pudo cargar el episodio.</p>';
      });
    });
  }
  boot();
})();
</script>
<canvas id="promii-webgl-canvas" aria-hidden="true" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0.14"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/assets/promii-hyperfluid-config.js"></script>
<script src="/assets/promii-hyperfluid-engine.js"></script>
<script>
if (window.PromiiHyperfluid) {
  PromiiHyperfluid.init({ canvasId: 'promii-webgl-canvas', ambient: true, act: 'droplet', accent: '#C9A0FF', canvasOpacity: '0.14' });
}
</script>
</body>
</html>
