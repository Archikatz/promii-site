<!doctype html>
<html lang="es" data-theme="dark" data-title-en="Fractalia & Psicodelia · The Creator's Manuscript">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('promii-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fractalia & Psicodelia · Manuscrito del Creador</title>
<meta name="description" content="Manuscrito completo Fractalia y Psicodelia: 8 capítulos ES/EN con ilustración SVG por capítulo. Liquid glass, tinta, fractal.">
<meta name="keywords" content="Fractalia, Psicodelia, ArchiKatz, manuscrito, editorial, InDesign, Magnific, MCP, EPUB, liquid glass, diseño fijo, refluible">
<link rel="canonical" href="https://promii.co/editorial/manuscrito.html">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a227}
html[data-theme="dark"]{--bg:#0c0c10;--fg:#f2efe6;--card:#14141a;--line:rgba(255,255,255,.1);--muted:#9a9688}
html[data-theme="light"]{--bg:#f4f0e6;--fg:#1a1814;--card:#fff;--line:rgba(0,0,0,.08);--muted:#6a6658}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 Inter,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 100px}
.kicker{font:600 11px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{font:700 clamp(28px,5vw,42px)/1.15 "Playfair Display",serif;margin:10px 0 8px}
.lede{color:var(--muted);font-size:15px;max-width:48ch}
.toc{display:grid;gap:8px;margin:28px 0;padding:0;list-style:none}
.toc a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none;font-size:14px}
.toc a:hover{border-color:var(--gold)}
.toc span{color:var(--gold);font-weight:700;min-width:1.5em}
.ch{margin:56px 0;padding-top:12px;border-top:1px solid var(--line)}
.ch h2{font:700 24px "Playfair Display",serif;margin:12px 0 14px}
.ch .body{white-space:pre-wrap}
.art{margin:12px 0 18px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#07070c;aspect-ratio:16/10}
.art svg{display:block;width:100%;height:100%}
.navrow{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{display:inline-flex;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font:600 12px Inter;color:inherit;text-decoration:none}
.chip.gold{background:var(--gold);color:#1a1408;border:0}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker" data-en="ArchiKatz Editorial · Full manuscript">Sello ArchiKatz · Manuscrito completo</p>
  <h1 data-en="Fractalia & Psicodelia">Fractalia & Psicodelia</h1>
  <p class="lede" data-en="The Creator's Manuscript — eight chapters with chapter art (SVG). Drive source, Spanish + English.">El Manuscrito del Creador — ocho capítulos con ilustración SVG por capítulo. Fuente Drive, español + inglés.</p>
  <div class="navrow">
    <a class="chip gold" href="./">← Editorial</a>
    <a class="chip" href="/archikatz/">Universo</a>
    <a class="chip" href="#cap1" data-en="Start">Empezar</a>
  </div>
  <ol class="toc" id="toc"></ol>
  <div id="chapters"></div>
  <footer><p>Fuente: <em>FRACTALIA Y PSICODELIA: EL MANUSCRITO DEL CREADOR</em> · Drive · promii.co/editorial/</p></footer>
</main>
<script src="scenes.js"></script>
<script src="/assets/site-shell.js" data-mode="full"></script>
<script src="book-data.js"></script>
<script>
(function(){
  var ART = {1:['canvas','#c9a227'],2:['ink','#e8e0d0'],3:['screens','#4f9bff'],4:['psyche','#c9a0ff'],5:['fractal','#9b6dff'],6:['figure','#d4af37'],7:['glass','#22e0c8'],8:['end','#c9a227']};
  function EN(){ return document.documentElement.lang === 'en'; }
  function L(o){ if(!o) return ''; if(typeof o==='string') return o; return EN()?(o.en||o.es):(o.es||o.en); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function draw(){
    if(!window.BOOK||!BOOK.length){ document.getElementById('chapters').innerHTML='<p>No data</p>'; return; }
    document.getElementById('toc').innerHTML = BOOK.map(function(c){
      return '<li><a href="#cap'+c.n+'"><span>'+c.n+'</span> '+esc(L(c.title))+'</a></li>';
    }).join('');
    document.getElementById('chapters').innerHTML = BOOK.map(function(c){
      var a = ART[c.n] || ['canvas','#c9a227'];
      var svg = (typeof AK_SCENE==='function') ? AK_SCENE(a[0], a[1], c.n*17) : '';
      return '<article class="ch" id="cap'+c.n+'"><p class="kicker">Cap. '+c.n+'</p><div class="art" aria-hidden="true">'+svg+'</div><h2>'+esc(L(c.title))+'</h2><div class="body">'+esc(EN()?c.en:c.es)+'</div></article>';
    }).join('');
  }
  draw();
  try{ addEventListener('promii:lang', draw); }catch(e){}
})();
</script>
</body>
</html>
