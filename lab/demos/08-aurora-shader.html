<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fondo líquido WebGL · Promii Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Fondo de seda líquida en WebGL (shader propio, sin librerías, ~3 KB): ruido fbm con deformación
   de dominio en negro, azul y rojo Promii; reacciona al mouse y se pausa fuera de pantalla. */
:root{--bg:#050508;--text:#f4f4f8;--muted:#b9b9cc;--blue:#2f6bff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.fallback{position:fixed;inset:0;background:radial-gradient(60% 60% at 25% 30%,rgba(47,107,255,.6),transparent 70%),radial-gradient(50% 50% at 80% 75%,rgba(255,59,48,.5),transparent 70%),var(--bg)}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));padding:30px;border-radius:40px;corner-shape:superellipse(1.8);
  background:rgba(255,255,255,.06);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3),inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px -30px rgba(0,0,0,.8)}
.card small{letter-spacing:.24em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.card h1{font:700 clamp(30px,6vw,52px)/1 "Space Grotesk";letter-spacing:-.035em;margin:10px 0 12px}
.card p{margin:0;color:var(--muted)}
.ctl{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(0,0,0,.4);backdrop-filter:blur(12px)}
.ctl button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font:500 12px Inter;color:var(--muted)}
.ctl button[aria-pressed="true"]{background:#f4f4f8;color:#0b0b10}
.ctl button:focus-visible{outline:2px solid var(--blue)}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="card"><small>Promii · Brian Zuleta</small><h1>Seda líquida en tiempo real</h1><p>Un shader de GPU genera el fondo. Mueve el mouse para empujar el flujo. Pesa menos que una foto.</p></div>
<div class="ctl" role="group" aria-label="Paleta">
  <button type="button" data-p="0" aria-pressed="true">Promii</button>
  <button type="button" data-p="1" aria-pressed="false">Azul</button>
  <button type="button" data-p="2" aria-pressed="false">Mono</button>
</div>
<script>
(() => {
  const c = document.getElementById('c');
  const gl = c.getContext('webgl', { antialias: false, premultipliedAlpha: false });
  if (!gl) { c.remove(); const f = document.createElement('div'); f.className = 'fallback'; document.body.prepend(f); return; }
  const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  const fs = `precision highp float;
  uniform vec2 r;uniform float t;uniform vec2 m;uniform vec3 c1;uniform vec3 c2;uniform vec3 c3;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
  float fbm(vec2 p){float v=0.,a=.5;mat2 R=mat2(.8,.6,-.6,.8);for(int i=0;i<5;i++){v+=a*n(p);p=R*p*2.02;a*=.5;}return v;}
  void main(){
    vec2 uv=gl_FragCoord.xy/r.xy;vec2 p=(gl_FragCoord.xy-.5*r.xy)/r.y;
    vec2 mm=(m-.5*r.xy)/r.y;float d=length(p-mm);
    p+=normalize(p-mm+1e-4)*.08*exp(-d*3.);
    float T=t*.06;
    vec2 q=vec2(fbm(p*1.4+T),fbm(p*1.4+vec2(5.2,1.3)-T));
    vec2 w=vec2(fbm(p*1.6+2.*q+vec2(1.7,9.2)+T*1.3),fbm(p*1.6+2.*q+vec2(8.3,2.8)-T));
    float f=fbm(p*1.2+2.4*w);
    vec3 col=vec3(.012,.012,.02);
    col=mix(col,c1,smoothstep(.35,.85,f)*.95);
    col=mix(col,c2,smoothstep(.45,.95,w.x*f*1.6)*.85);
    float silk=pow(smoothstep(.55,.98,f+q.y*.25),3.);
    col+=c3*silk*.55;
    col*=1.-.55*length(uv-.5);
    col+=(h(gl_FragCoord.xy+t)-.5)*.035;
    gl_FragColor=vec4(col,1.);
  }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = k => gl.getUniformLocation(pr, k);
  const palettes = [
    [[.18, .42, 1.], [1., .23, .19], [1., 1., 1.]],
    [[.12, .3, .95], [.35, .55, 1.], [.85, .9, 1.]],
    [[.35, .35, .4], [.6, .6, .68], [1., 1., 1.]]
  ];
  let pal = palettes[0], target = palettes[0];
  const DPR = Math.min(devicePixelRatio || 1, 1.5);
  function size() { c.width = innerWidth * DPR * .6; c.height = innerHeight * DPR * .6; gl.viewport(0, 0, c.width, c.height); }
  size(); addEventListener('resize', size);
  const mouse = { x: innerWidth * .7, y: innerHeight * .4 }, sm = { ...mouse };
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.querySelectorAll('[data-p]').forEach(btn => btn.addEventListener('click', () => {
    target = palettes[+btn.dataset.p]; document.querySelectorAll('[data-p]').forEach(x => x.setAttribute('aria-pressed', x === btn));
  }));
  let visible = true;
  new IntersectionObserver(e => visible = e[0].isIntersecting).observe(c);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = 20, last = performance.now();
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (visible && !document.hidden) {
      t += reduce ? dt * .15 : dt;
      sm.x += (mouse.x - sm.x) * .05; sm.y += (mouse.y - sm.y) * .05;
      pal = pal.map((col, i) => col.map((v, j) => v + (target[i][j] - v) * .06));
      gl.uniform2f(U('r'), c.width, c.height); gl.uniform1f(U('t'), t);
      gl.uniform2f(U('m'), sm.x / innerWidth * c.width, (1 - sm.y / innerHeight) * c.height);
      gl.uniform3fv(U('c1'), pal[0]); gl.uniform3fv(U('c2'), pal[1]); gl.uniform3fv(U('c3'), pal[2]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
