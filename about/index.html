<!doctype html>
<html lang="es" data-theme="dark" data-title-en="About · Skills & experience · Brian Zuleta">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('promii-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>About · Brian Zuleta · Promii</title>
<meta name="description" content="Arquitectura, BIM, marketing, web y PM. Habilidades y resultados sin datos sensibles. CV a solicitud.">
<link rel="canonical" href="https://promii.co/about/">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b10;--fg:#f2f2f8;--muted:#9a9ab0;--line:rgba(255,255,255,.1);--acc:#2f6bff}
html[data-theme="light"]{--bg:#f4f4f8;--fg:#15151c;--muted:#5a5a70;--line:rgba(0,0,0,.1)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Inter,system-ui}
.wrap{max-width:900px;margin:0 auto;padding:32px 16px 80px}
h1{font:700 clamp(28px,5vw,40px)/1.1 Space Grotesk,system-ui;margin:0 0 10px}
.lede{color:var(--muted);max-width:52ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:28px 0}
.card{padding:18px;border-radius:16px;border:1px solid var(--line);background:rgba(127,127,127,.06)}
.card h3{margin:0 0 8px;font:700 17px Space Grotesk}
.card p{margin:0;color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tools span{font:600 11px Inter;padding:4px 8px;border-radius:999px;border:1px solid var(--line);opacity:.85}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.row a{padding:10px 16px;border-radius:999px;font:600 13px Inter;text-decoration:none;border:1px solid var(--line);color:inherit}
.row a.primary{background:var(--acc);border:0;color:#fff}
</style>
</head>
<body>
<main class="wrap">
  <h1 data-en="Skills & experience">Habilidades y experiencia</h1>
  <p class="lede" data-en="Public profile: specialties and tools — not a full timeline. Request the CV privately.">Perfil público: especialidades y herramientas, no una línea de tiempo completa. Solicita el CV en privado.</p>
  <div class="grid" id="cards"></div>
  <p class="lede" data-en="Use the contact form or LinkedIn. I send the CV only to people I choose.">Usa el formulario de contacto o LinkedIn. Envío el CV solo a quien yo elija.</p>
  <div class="row">
    <a class="primary" href="/#contacto" data-en="Contact">Contacto</a>
    <a href="https://www.linkedin.com/in/bczuleta/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://www.behance.net/brianzuleta" target="_blank" rel="noopener">Behance</a>
    <a href="/privacy/">Privacy</a>
  </div>
</main>
<script src="/assets/site-shell.js" data-mode="full"></script>
<script>
(function(){
  var cards=[
    {es:{t:'Arquitectura & BIM',d:'Modelado LOD 300–400, coordinación, cumplimiento y documentación técnica.'},en:{t:'Architecture & BIM',d:'LOD 300–400 modeling, coordination, compliance and technical docs.'},tools:['Revit','AutoCAD','Dynamo','Enscape']},
    {es:{t:'Construcción & entrega',d:'Coordinación remota, estándares de entrega y control de calidad.'},en:{t:'Construction & delivery',d:'Remote coordination, delivery standards and QA.'},tools:['Dropbox','Bluebeam','Navisworks']},
    {es:{t:'Marketing & KAM ops',d:'Funnels, CRM y servicios productizados (Promii).'},en:{t:'Marketing & KAM ops',d:'Funnels, CRM and productized services (Promii).'},tools:['GoHighLevel','LinkedIn','MailerLite','Copy systems']},
    {es:{t:'Web & tech',d:'Sitios, automatización, deploy y sistemas de contenido.'},en:{t:'Web & tech',d:'Sites, automation, deploy and content systems.'},tools:['GitHub','Vercel','GoDaddy','n8n']},
    {es:{t:'Project management',d:'Equipos remotos, SOPs y márgenes sostenibles.'},en:{t:'Project management',d:'Remote teams, SOPs and healthy margins.'},tools:['Notion','Asana','SOPs']}
  ];
  function EN(){return document.documentElement.lang==='en';}
  function draw(){
    document.getElementById('cards').innerHTML=cards.map(function(c){
      var t=EN()?c.en:c.es;
      return '<article class="card"><h3>'+t.t+'</h3><p>'+t.d+'</p><div class="tools">'+c.tools.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div></article>';
    }).join('');
  }
  draw();
  try{addEventListener('promii:lang',draw);}catch(e){}
})();
</script>
</body>
</html>
