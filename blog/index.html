<!doctype html>
<html lang="es" data-theme="dark" data-title-en="Promii Blog · AEC Tech & Systems">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blog Promii · AEC Tech & Systems</title>
<meta name="description" content="Bitácora & Insights: BIM, IA, normativa NYC y sistemas operativos de producción AEC. Hub B2B de Brian Zuleta.">
<link rel="canonical" href="https://promii.co/blog/">
<meta property="og:title" content="Promii Blog · AEC Tech">
<meta property="og:image" content="https://promii.co/assets/og.jpg">
<meta name="theme-color" content="#08080c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;--text:#f4f4f8;--muted:#a6a6bc;--dim:#6e6e86;
  --line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.05);--hi:rgba(255,255,255,.14);
  --blue:#2f6bff;--display:"Space Grotesk",system-ui,sans-serif;--serif:"Fraunces",Georgia,serif;--body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(42% 36% at 10% 0%,rgba(47,107,255,.28),transparent 70%),
  radial-gradient(38% 32% at 90% 100%,rgba(255,59,48,.18),transparent 70%)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.hero{padding:48px 0 28px}
.hero .kicker{font:600 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.hero h1{font:700 clamp(32px,5vw,52px)/1.08 var(--serif);letter-spacing:-.02em;margin:10px 0 12px;max-width:18ch}
.hero p{color:var(--muted);max-width:52ch;margin:0 0 20px;font-size:17px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:18px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 12.5px var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);color:var(--muted);cursor:pointer;backdrop-filter:blur(12px)}
.pill.on,.pill:hover{color:var(--text);border-color:rgba(47,107,255,.45);background:rgba(47,107,255,.12)}
.lang{display:flex;gap:4px}
.grid{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.cards{display:grid;gap:12px}
.card{display:block;padding:18px;border-radius:22px;background:var(--glass);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--hi),0 18px 40px -24px rgba(0,0,0,.7);backdrop-filter:blur(16px) saturate(1.3);transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(47,107,255,.35);transform:translateY(-2px)}
.card h2{font:700 18px var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11.5px;color:var(--dim)}
.tag{padding:3px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
.tag:hover{border-color:var(--blue);color:var(--text)}
.pillar{color:var(--blue);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.wiki{position:sticky;top:80px;padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(16px);max-height:calc(100vh - 100px);overflow:auto}
.wiki h3{font:700 14px var(--serif);margin:0 0 10px}
.wiki button{display:block;width:100%;text-align:left;font:500 13px var(--body);color:var(--muted);
  background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.06);padding:10px 4px;cursor:pointer}
.wiki button:hover{color:var(--text)}
.reader{display:none;padding:28px 0 60px;max-width:720px}
.reader.on{display:block}
.list-view.hide{display:none}
.reader .back{font:600 13px var(--body);color:var(--blue);margin-bottom:18px;display:inline-flex;cursor:pointer;background:0;border:0}
.reader h1{font:700 clamp(28px,4vw,40px)/1.15 var(--serif);margin:0 0 12px}
.reader .body{font-size:17px;line-height:1.75}
.reader .body h2{font:700 22px var(--serif);margin:28px 0 10px}
.reader .body p{margin:0 0 14px;color:#d8d8e4}
.reader .body a.wk{color:var(--blue);border-bottom:1px dashed rgba(47,107,255,.5);cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal .panel{max-width:420px;width:100%;padding:22px;border-radius:24px;background:rgba(14,14,20,.92);border:1px solid var(--line)}
.modal h4{font:700 20px var(--serif);margin:0 0 8px}
.modal p{margin:0;color:var(--muted);font-size:14.5px}
.modal .x{float:right;border:0;background:rgba(255,255,255,.1);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<script src="/assets/site-shell.js" data-mode="full" data-dark-only></script>
<main class="wrap">
  <header class="hero">
    <div class="kicker" data-en="AEC Tech · Systems · B2B">AEC Tech · Sistemas · B2B</div>
    <h1 data-en="Bitácora & Insights">Bitácora & Insights</h1>
    <p data-en="Technical AEC essays: BIM, AI, NYC code, and production systems. For the ArchiKatz creative universe, go to Editorial.">Ensayos técnicos AEC: BIM, IA, normativa NYC y sistemas de producción. El universo creativo ArchiKatz vive en <a href="/editorial/" style="color:var(--blue)">Editorial →</a></p>
    <div class="bar">
      <div class="filters" id="filters" role="tablist" aria-label="Pilares"></div>
      <div class="lang" role="group" aria-label="Idioma">
        <button type="button" class="pill on" data-lang="es">ES</button>
        <button type="button" class="pill" data-lang="en">EN</button>
      </div>
    </div>
  </header>
  <div class="list-view" id="listView">
    <div class="grid">
      <div class="cards" id="cards"></div>
      <aside class="wiki" id="wiki" aria-label="Knowledge graph">
        <h3 data-en="Wiki · Keywords">Wiki · Keywords</h3>
        <div id="wikiList"></div>
      </aside>
    </div>
  </div>
  <article class="reader" id="reader">
    <button type="button" class="back" id="backBtn" data-en="← All entries">← Todas las entradas</button>
    <div class="pillar" id="rPillar"></div>
    <h1 id="rTitle"></h1>
    <div class="meta" id="rMeta"></div>
    <div class="body" id="rBody"></div>
  </article>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="panel">
    <button type="button" class="x" id="modalX" aria-label="Cerrar">×</button>
    <h4 id="modalT"></h4>
    <p id="modalP"></p>
  </div>
</div>
<script>
(function(){
  var lang=(localStorage.getItem('promii-lang')==='en')?'en':'es';
  var pillar='ALL', posts=[], wiki={terms:{},pillars:{}};
  var cards=document.getElementById('cards'), wikiList=document.getElementById('wikiList');
  var listView=document.getElementById('listView'), reader=document.getElementById('reader');
  var PILLAR_ORDER=['P1_BIM_AI','P2_CODE_DATA','P3_SYSTEMS','P4_ARCHVIZ'];
  function L(es,en){return lang==='en'?(en||es):es}
  function paintFilters(){
    var f=document.getElementById('filters');
    var items=[{id:'ALL',es:'Todos',en:'All'}].concat(PILLAR_ORDER.map(function(id){
      var p=wiki.pillars[id]||{}; return {id:id,es:p.es||id,en:p.en||id};
    }));
    f.innerHTML=items.map(function(it){
      return '<button type="button" class="pill'+(pillar===it.id?' on':'')+'" data-p="'+it.id+'">'+L(it.es,it.en)+'</button>';
    }).join('');
    f.querySelectorAll('[data-p]').forEach(function(b){
      b.onclick=function(){pillar=b.getAttribute('data-p'); paintFilters(); paintCards();};
    });
  }
  function paintWiki(){
    wikiList.innerHTML=Object.keys(wiki.terms||{}).map(function(k){
      return '<button type="button" data-term="'+k+'">'+k+'</button>';
    }).join('');
    wikiList.querySelectorAll('[data-term]').forEach(function(b){
      b.onclick=function(){showTerm(b.getAttribute('data-term'));};
    });
  }
  function showTerm(k){
    var t=wiki.terms[k]; if(!t)return;
    document.getElementById('modalT').textContent=k;
    document.getElementById('modalP').textContent=L(t.es,t.en);
    document.getElementById('modal').classList.add('on');
  }
  function paintCards(){
    var list=posts.filter(function(p){return pillar==='ALL'||p.pillar===pillar;});
    if(!list.length){cards.innerHTML='<div class="empty">—</div>';return;}
    cards.innerHTML=list.map(function(p){
      var title=L(p.title,p.title_en), sum=L(p.summary,p.summary_en);
      var pl=wiki.pillars[p.pillar]||{};
      var tags=(p.tags||[]).map(function(t){return '<span class="tag" data-term="'+t+'">'+t+'</span>';}).join('');
      return '<a class="card" href="?p='+encodeURIComponent(p.slug)+'" data-slug="'+p.slug+'">'+'
        <div class="pillar">'+L(pl.es,pl.en)+'</div><h2>'+title+'</h2><p>'+sum+'</p>'+
        '<div class="meta"><span>'+p.date+'</span><span>'+p.minutes+' min</span>'+tags+'</div></a>';
    }).join('');
    cards.querySelectorAll('[data-term]').forEach(function(t){
      t.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showTerm(t.getAttribute('data-term'));});
    });
  }
  function mdLite(s){
    s=s.replace(/^# .+\n+/,'');
    s=s.replace(/^## (.+)$/gm,'<h2>$1</h2>');
    s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
    s=s.replace(/\[\[(.+?)\]\]/g,function(_,t){return '<a class="wk" data-term="'+t+'">'+t+'</a>';});
    s=s.replace(/^(?!<h2)(.+)$/gm,function(m){return m.trim()?'<p>'+m+'</p>':'';});
    return s;
  }
  function openPost(slug){
    var p=posts.find(function(x){return x.slug===slug}); if(!p)return;
    var pl=wiki.pillars[p.pillar]||{};
    document.getElementById('rPillar').textContent=L(pl.es,pl.en);
    document.getElementById('rTitle').textContent=L(p.title,p.title_en);
    document.getElementById('rMeta').innerHTML='<span>'+p.date+'</span><span>'+p.minutes+' min</span>';
    listView.classList.add('hide'); reader.classList.add('on');
    window.scrollTo(0,0);
    history.replaceState(null,'','?p='+encodeURIComponent(slug));
    var path;
    if(p.legacy){
      path = p.src || ('/bitacora/posts/'+p.slug+'.md');
      if(lang==='en' && p.src) path = p.src.replace('/posts/','/posts/en/');
    } else {
      path = '/blog/posts/'+p.slug+(lang==='en'?'.en':'')+'.md';
    }
    fetch(path).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(md){
      var body=document.getElementById('rBody');
      body.innerHTML=mdLite(md);
      body.querySelectorAll('[data-term]').forEach(function(a){
        a.onclick=function(e){e.preventDefault();showTerm(a.getAttribute('data-term'));};
      });
    }).catch(function(){
      if(p.legacy && lang==='en'){
        fetch(p.src||('/bitacora/posts/'+p.slug+'.md')).then(function(r){return r.text()}).then(function(md){
          document.getElementById('rBody').innerHTML=mdLite(md);
        });
      } else {
        document.getElementById('rBody').innerHTML='<p>'+L(p.summary,p.summary_en)+'</p>';
      }
    });
  }
  function closePost(){
    reader.classList.remove('on'); listView.classList.remove('hide');
    history.replaceState(null,'',location.pathname);
  }
  document.getElementById('backBtn').onclick=closePost;
  document.getElementById('modalX').onclick=function(){document.getElementById('modal').classList.remove('on');};
  document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')e.currentTarget.classList.remove('on');};
  document.querySelectorAll('.lang .pill').forEach(function(b){
    b.onclick=function(){
      lang=b.getAttribute('data-lang');
      try{localStorage.setItem('promii-lang',lang);}catch(e){}
      document.documentElement.lang=lang;
      document.querySelectorAll('.lang .pill').forEach(function(x){x.classList.toggle('on',x===b);});
      document.querySelectorAll('[data-en]').forEach(function(el){
        if(!el._es) el._es=el.textContent;
        el.textContent = lang==='en' ? el.getAttribute('data-en') : el._es;
      });
      paintFilters(); paintCards(); paintWiki();
      var q=new URLSearchParams(location.search).get('p');
      if(q) openPost(q);
    };
  });
  Promise.all([
    fetch('/blog/posts.json').then(function(r){return r.json()}),
    fetch('/blog/wiki.json').then(function(r){return r.json()})
  ]).then(function(arr){
    posts=arr[0]; wiki=arr[1];
    if(lang==='en') document.querySelectorAll('.lang .pill').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-lang')==='en');});
    paintFilters(); paintWiki(); paintCards();
    var q=new URLSearchParams(location.search).get('p');
    if(q) openPost(q);
  });
})();
</script>
</body>
</html>
