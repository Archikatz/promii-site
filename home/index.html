<!doctype html>

<style>
:root{--bg:#06060a;--text:#f4f4f8;--muted:#a6a6bc;--dim:#6e6e86;--line:rgba(255,255,255,.1);--accent:#ff3b30;--display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--body:"Inter",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.hero{position:relative;height:calc(100svh - 66px);min-height:560px;overflow:hidden;margin-top:-56px;padding-top:56px;touch-action:pan-y}
.bg{position:absolute;inset:0;background:
  radial-gradient(40% 32% at 18% 16%,rgba(47,107,255,.32),transparent 70%),
  radial-gradient(38% 30% at 86% 84%,rgba(255,59,48,.26),transparent 70%),
  radial-gradient(30% 26% at 82% 18%,rgba(34,224,200,.16),transparent 70%),
  radial-gradient(34% 28% at 14% 86%,rgba(232,178,58,.14),transparent 70%),var(--bg)}
.bg::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.3px);background-size:104px 104px,104px 104px,26px 26px;mask:radial-gradient(70% 60% at 50% 50%,#000 30%,transparent 100%);-webkit-mask:radial-gradient(70% 60% at 50% 50%,#000 30%,transparent 100%)}
.ring{position:absolute;left:50%;top:50%;width:min(84vw,84vh,520px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1px dashed rgba(255,255,255,.08);pointer-events:none;transition:opacity .8s}
.ring.r2{width:min(56vw,56vh,340px)}
body:not(.open) .ring{opacity:0}
.pill{font:600 13px var(--body);color:var(--text);text-decoration:none;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer}
.pill:hover{background:rgba(255,255,255,.12)}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 16px calc(18px + env(safe-area-inset-bottom));z-index:20}
.hello{position:absolute;left:0;right:0;top:calc(50% + min(24vw,110px));text-align:center;pointer-events:none;transition:opacity .6s,transform .8s cubic-bezier(.2,.7,.2,1)}
.hello h1{position:relative;display:inline-block;font:700 clamp(68px,15vw,148px)/.86 var(--display);letter-spacing:-.075em;margin:0;padding:0 .06em}
.wm-t{position:relative;background:linear-gradient(100deg,#9aa6e8 0%,#ffffff 22%,#e9ecff 38%,#ffffff 46%,#aab3ee 60%,#ffffff 78%,#c6ccf5 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite;filter:drop-shadow(0 14px 34px rgba(47,107,255,.35)) drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.wm-o{position:absolute;inset:0;padding:0 .06em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.16);transform:translate(.045em,.05em);pointer-events:none}
.wm-ii{position:relative;display:inline-block}
.wm-ii i{position:absolute;left:58%;top:.14em;width:.17em;height:.17em;margin-left:-.085em;border-radius:50%;background:radial-gradient(35% 28% at 34% 26%,#fff,rgba(255,255,255,.4) 45%,transparent 75%),radial-gradient(80% 70% at 50% 100%,var(--dc),transparent 70%),rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 6px 16px -4px var(--dc);animation:bob 3.6s ease-in-out infinite}
.wm-ii+.wm-ii i{animation-delay:-1.8s}
.wm-dim{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px auto 0;width:min(70%,420px);font:600 10px var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.wm-dim::before,.wm-dim::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(47,107,255,.7),rgba(47,107,255,.2));border-left:1px solid rgba(47,107,255,.9);border-right:1px solid rgba(47,107,255,.9);height:7px;background-size:100% 1px;background-repeat:no-repeat;background-position:center}
@keyframes sheen{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.05em)}}
.hello p{margin:12px 0 0;color:var(--muted);font-size:14px;letter-spacing:.04em}
body.open .hello{opacity:0;transform:translateY(20px)}
.drop{position:absolute;left:0;top:0;border-radius:50%;will-change:transform;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;display:grid;place-items:center;text-align:center;
  background:
   radial-gradient(30% 16% at 33% 17%,rgba(255,255,255,.95),rgba(255,255,255,.35) 45%,transparent 72%),
   radial-gradient(14% 8% at 70% 84%,rgba(255,255,255,.55),transparent 75%),
   radial-gradient(75% 60% at 50% 100%,color-mix(in srgb,var(--c,#fff) 42%,transparent),transparent 70%),
   radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.08),rgba(255,255,255,.02) 50%,rgba(0,0,0,.18) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 1.5px 1px rgba(255,255,255,.85),inset 4px 3px 6px -2px rgba(255,90,130,.45),inset -4px -3px 6px -2px rgba(70,180,255,.5),inset 0 -18px 26px -18px color-mix(in srgb,var(--c,#fff) 80%,white),inset 0 12px 22px -14px rgba(0,0,0,.35),0 26px 40px -22px rgba(0,0,0,.85),0 6px 30px -12px color-mix(in srgb,var(--c,#fff) 70%,transparent);
  backdrop-filter:saturate(1.9) brightness(1.15) contrast(1.06);-webkit-backdrop-filter:saturate(1.9) brightness(1.15) contrast(1.06)}
.drop::after{content:"";position:absolute;left:12%;right:12%;bottom:-18%;height:22%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c,#fff) 45%,transparent),transparent);filter:blur(6px);opacity:.55;pointer-events:none}
.drop.held{cursor:grabbing}
.drop span{font:600 clamp(11.5px,1.5vw,13.5px)/1.12 var(--display);letter-spacing:-.01em;padding:0 10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.35);pointer-events:none;-webkit-font-smoothing:antialiased}
.core{width:min(34vw,150px);height:min(34vw,150px);animation:breath 6s ease-in-out infinite}
.core::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(255,255,255,.14);animation:pulse 2.6s cubic-bezier(.2,.7,.2,1) infinite}
.core span{font:700 15px var(--display);letter-spacing:.02em}
@keyframes breath{0%,100%{border-radius:50%}33%{border-radius:47% 53% 52% 48%/52% 47% 53% 48%}66%{border-radius:53% 47% 48% 52%/48% 54% 46% 52%}}
@keyframes pulse{0%{scale:.9;opacity:.8}100%{scale:1.35;opacity:0}}
body.open .core::after{display:none}
.sheet{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));max-height:min(72vh,640px);overflow:auto;translate:-50% 0;z-index:30;padding:20px 20px 16px;border-radius:28px;
  background:rgba(14,14,20,.72);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12);
  transform:translateY(calc(100% + 30px));transition:transform .6s cubic-bezier(.2,.9,.25,1.05)}
.sheet.on{transform:none}
.sheet h2{font:700 24px var(--display);letter-spacing:-.02em;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sheet h2 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sheet .x{position:sticky;top:0;float:right;border:0;background:rgba(255,255,255,.1);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:16px;color:var(--text);text-decoration:none}
.it:hover{background:rgba(255,255,255,.07)}
.it b{display:block;font:600 16px var(--display)}.it em{display:block;font-style:normal;color:var(--muted);font-size:13.5px}
.chip{flex:none;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:var(--dim)}
.chip.live{color:#30d158;border-color:rgba(48,209,88,.4)}
.phys{position:fixed;right:12px;top:calc(74px + env(safe-area-inset-top));z-index:25;width:min(300px,calc(100% - 24px));padding:14px 16px;border-radius:22px;background:rgba(14,14,20,.7);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.14);display:none}
.phys.on{display:block}
.phys label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px;color:var(--muted);margin:8px 0}
.phys label output{color:var(--text);font-variant-numeric:tabular-nums}
.phys input[type=range]{grid-column:1/-1;width:100%;accent-color:#22e0c8}
.phys .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.phys .row button{flex:1;font:600 12px var(--body);color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 10px;cursor:pointer}
.phys .row button.on{background:#22e0c8;color:#06060a;border-color:transparent}
.mapsec{max-width:1120px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 0}
.mapsec .eye{font:600 11px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}.mapsec .eye::before{content:"";width:18px;height:2px;background:var(--accent)}
.mapsec h2{font:700 clamp(30px,5vw,48px)/1.05 var(--display);letter-spacing:-.03em;margin:12px 0 8px}
.mapsec>p{color:var(--muted);margin:0;max-width:60ch}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:22px}
.mg{padding:18px;border-radius:24px;background:linear-gradient(140deg,rgba(255,255,255,.07),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.mg h3{display:flex;align-items:center;gap:10px;font:700 19px var(--display);margin:0 0 8px}.mg h3 i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.mg .it{padding:9px 10px}
@media (prefers-reduced-motion:reduce){.core,.core::after,.wm-t,.wm-ii i{animation:none}}
</style>
</head>
<body>
<section class="hero" id="hero" aria-label="Caminos" data-en-label="Paths">
<div class="bg" aria-hidden="true"></div>
<div class="ring" aria-hidden="true"></div><div class="ring r2" aria-hidden="true"></div>
<div class="hello" id="hello"><h1 aria-label="promii"><span class="wm-o" aria-hidden="true">promii</span><span class="wm-t">prom<span class="wm-ii">ı<i style="--dc:#2f6bff"></i></span><span class="wm-ii">ı<i style="--dc:#ff3b30"></i></span></span></h1><div class="wm-dim" aria-hidden="true">A-00 · promii.co</div><p data-en="Tap the drop and choose your path">Toca la gota y escoge tu camino</p></div>
<canvas id="trail" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
<div id="world" aria-label="Caminos"></div>
<div class="bottom"><a class="pill" href="/" data-en="Enter the portfolio →">Entrar al portafolio →</a><button class="pill" id="mapBtn" type="button" data-en="Full map ↓">Mapa completo ↓</button><button class="pill" id="physBtn" type="button" aria-expanded="false" data-en="Physics">Física</button></div>
</section>
<section class="mapsec" id="mapa"><div class="eye" data-en="Site map">Mapa del sitio</div><h2 data-en="Everything on promii.co, by path">Todo lo que hay en promii.co, por camino</h2><p data-en="This map grows as the site grows. Tap any destination.">Este mapa crece a medida que el sitio crece. Toca cualquier destino.</p><div class="mgrid" id="mgrid"></div></section>
<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetT"><button class="x" id="sheetX" type="button" aria-label="Cerrar" data-en-label="Close">×</button><div id="sheetIn"></div></section>
<section class="phys" id="phys" aria-label="Controles de física" data-en-label="Physics controls">
  <label><span data-en="Central gravity">Gravedad central</span> <output id="o-g"></output><input type="range" id="g" min="0" max="2" step=".05" value="1"></label>
  <label><span data-en="Gravity between drops">Gravedad entre gotas</span> <output id="o-n"></output><input type="range" id="n" min="0" max="3" step=".05" value="1"></label>
  <label><span data-en="Anti-gravity">Antigravedad</span> <output id="o-a"></output><input type="range" id="a" min="0" max="3" step=".05" value="1"></label>
  <label><span data-en="Spin (centrifugal force)">Giro (fuerza centrífuga)</span> <output id="o-s"></output><input type="range" id="s" min="-2" max="2" step=".05" value=".4"></label>
  <label><span data-en="Bounce on impact">Rebote al chocar</span> <output id="o-e"></output><input type="range" id="e" min="0" max="1" step=".05" value=".7"></label>
  <label><span data-en="Friction">Fricción</span> <output id="o-f"></output><input type="range" id="f" min="0" max="2" step=".05" value=".3"></label>
  <div class="row"><button type="button" id="three" data-en="Three bodies">Tres cuerpos</button><button type="button" id="shake" data-en="Shake">Sacudir</button><button type="button" id="calm" data-en="Calm">Calmar</button></div>
</section>
<script src="/assets/home-paths.js"></script>
<script src="/assets/site-shell.js" data-mode="full" data-dark-only></script>
<script>
(function(){
 var SITE=window.PROMII_SITE||{map:[]};if(!SITE.map||!SITE.map.length)SITE.map=(window.PROMII_PATH_MAP||[]);var world=document.getElementById('world'),body=document.body,hero=document.getElementById('hero'),L=function(o){if(!o)return'';if(typeof o==='string')return o;var en=document.documentElement.lang==='en';return en?(o.en||o.es||''):(o.es||o.en||'');};
 var W=hero.clientWidth,H=hero.clientHeight,cx=W/2,cy=H/2+20,heroOn=true,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 var P={g:1,n:1,a:1,s:.4,e:.7,f:.3},mode='orbit',bodies=[],held=null,run=false,last=0;
 function q(id){return document.getElementById(id);}
 function esc(t){return String(t).replace(/&/g,'&').replace(/</g,'<');}
 function scale(){return Math.min(W,H)/800;}
 function mk(o){var el=document.createElement(o.href?'a':'button');el.className='drop'+(o.core?' core':'');if(o.href)el.href=o.href;else el.type='button';
  el.style.setProperty('--c',o.c||'#fff');el.innerHTML='<span>'+esc(L(o.t)||'')+'</span>';
  if(!o.core){el.style.width=el.style.height=(o.r*2)+'px';}
  world.appendChild(el);var b={el:el,x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,r:o.r,m:o.m||(o.r*o.r)/1600,sq:0,sa:0,data:o,core:o.core};
  bindDrag(b);bodies.push(b);return b;}
 var core=mk({core:1,t:{es:'Toca',en:'Tap'},x:cx,y:cy,r:0,c:'#ff3b30'});
 core.r=core.el.offsetWidth/2;core.fixed=true;window.__promiiCore=core;
 core.el.setAttribute('aria-label','Abrir los caminos');core.el.setAttribute('data-en-label','Open the paths');
 function burst(){if(body.classList.contains('open'))return;body.classList.add('open');mode='orbit';try{window.dispatchEvent(new Event('promii:burst'));}catch(e){}
  core.el.animate([{scale:'1 1'},{scale:'1.25 .8'},{scale:'.85 1.15'},{scale:'1 1'}],{duration:520,easing:'ease-out'});
  core.el.querySelector('span').textContent='promii';core.data.t='promii';
  var groups=SITE.map||[],n=groups.length,s=scale(),R0=Math.max(110,Math.min(W,H)*.3);
  groups.forEach(function(g,i){var ang=i/n*Math.PI*2-Math.PI/4,r=Math.max(42,64*s+8),rad=R0*.82;
   var v=Math.sqrt(GM()/rad),b=mk({t:g.g,c:g.c,r:r,x:cx+Math.cos(ang)*core.r*.6,y:cy+Math.sin(ang)*core.r*.6,vx:Math.cos(ang)*700-Math.sin(ang)*v,vy:Math.sin(ang)*700+Math.cos(ang)*v,group:g});b.home=rad;});
  var sat=[];groups.forEach(function(g){var it=g.items.filter(function(x){return x.sat;})[0]||g.items.filter(function(x){return x.st==='live'&&L(x.t).length<=12;})[0];if(it)sat.push({g:g,it:it});});
  sat.forEach(function(o,i){var ang=i/sat.length*Math.PI*2,rad=R0*1.3,r=Math.max(30,38*s),v=Math.sqrt(GM()/rad),b=mk({t:o.it.t,c:o.g.c,r:r,x:cx+Math.cos(ang)*core.r*.6,y:cy+Math.sin(ang)*core.r*.6,vx:Math.cos(ang)*900-Math.sin(ang)*v*1.1,vy:Math.sin(ang)*900+Math.cos(ang)*v*1.1,href:o.it.href,item:o.it});b.home=rad;});
  wake();}
 function GM(){return 2.6e6*Math.pow(scale(),3)*P.g+1;}
 function three(){clear();mode='three';body.classList.add('open');core.el.style.opacity='0';core.el.style.pointerEvents='none';
  var LL=Math.min(W,H)*.34,T=1.15,c=['#2f6bff','#ff3b30','#22e0c8'],X=[[-.97000436,.24308753],[0,0],[.97000436,-.24308753]],v3=[-.93240737,-.86473146],V=[[-v3[0]/2,-v3[1]/2],[v3[0],v3[1]],[-v3[0]/2,-v3[1]/2]];
  window._G3=LL*LL*LL/(T*T);
  for(var i=0;i<3;i++)mk({t:['Brian','Promii','ArchiKatz'][i],c:c[i],r:Math.max(26,34*scale()),m:1,x:cx+X[i][0]*LL,y:cy+X[i][1]*LL,vx:V[i][0]*LL/T,vy:V[i][1]*LL/T});
  q('three').classList.add('on');wake();}
 function clear(){bodies.filter(function(b){return !b.core;}).forEach(function(b){b.el.remove();});bodies=[core];}
 function orbitMode(){clear();q('three').classList.remove('on');core.el.style.opacity='';core.el.style.pointerEvents='';body.classList.remove('open');burst();}
 function bindDrag(b){var el=b.el,down=null;
  el.addEventListener('pointerdown',function(e){if(e.button>0)return;down={x:e.clientX,y:e.clientY,t:performance.now(),h:[]};el.setPointerCapture(e.pointerId);});

  el.addEventListener('pointerup',function(e){if(!down)return;var dt=performance.now()-down.t,d=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(held===b){var h=down.h;if(h.length>=2){var a=h[0],c=h[h.length-1],t=Math.max(16,c.t-a.t);b.vx=(c.x-a.x)/t*1000;b.vy=(c.y-a.y)/t*1000;}held=null;el.classList.remove('held');}else if(d<8&&dt<320)tap(b);down=null;});}
 function reassemble(){if(!body.classList.contains('open'))return;clear();body.classList.remove('open');mode='orbit';q('three').classList.remove('on');core.el.style.opacity='';core.el.style.pointerEvents='';var sp=core.el.querySelector('span');if(sp)sp.textContent='O';try{window.dispatchEvent(new Event('promii:reassemble'));}catch(e){}wake();}

 var sheet=q('sheet'),sin=q('sheetIn');
 function EN(){return document.documentElement.lang==='en';}
 function items(g){return (g.items||[]).map(function(it){return '<a class="it" href="'+it.href+'"><span><b>'+esc(L(it.t))+'</b><em>'+esc(L(it.d)||'')+'</em></span><span class="chip'+(it.st==='live'?' live':'')+'">'+(it.st==='live'?(EN()?'Live':'Activo'):(EN()?'Soon':'Pronto'))+'</span></a>';}).join('');}
 function drawMap(){q('mgrid').innerHTML=(SITE.map||[]).map(function(g){return '<div class="mg" style="--c:'+g.c+'"><h3><i></i>'+esc(L(g.g))+'</h3>'+items(g)+'</div>';}).join('');}
 function showGroup(g){sin.innerHTML='<h2 id="sheetT" style="--c:'+g.c+'"><i></i>'+esc(L(g.g))+'</h2>'+items(g);open();}
 function showMap(){sin.innerHTML='<h2 id="sheetT">'+(EN()?'Site map':'Mapa del sitio')+'</h2>'+(SITE.map||[]).map(function(g){return '<h3 style="--c:'+g.c+'"><i></i>'+esc(L(g.g))+'</h3>'+items(g);}).join('');open();}
 function open(){sheet.classList.add('on');}function close(){sheet.classList.remove('on');}
 q('sheetX').addEventListener('click',close);q('mapBtn').addEventListener('click',showMap);drawMap();
 addEventListener('promii:lang',function(){drawMap();bodies.forEach(function(b){var sp=b.el.querySelector('span');if(sp)sp.textContent=L(b.data.t);});close();});
 if('IntersectionObserver' in window)new IntersectionObserver(function(e){heroOn=e[0].isIntersecting;if(heroOn)wake();},{threshold:.05}).observe(hero);
 addEventListener('keydown',function(e){if(e.key==='Escape'){close();q('phys').classList.remove('on');}});
 world.addEventListener('pointerdown',function(e){if(e.target===world)close();});
 ['g','n','a','s','e','f'].forEach(function(k){var i=q(k),o=q('o-'+k);function u(){P[k]=+i.value;o.textContent=(+i.value).toFixed(2);wake();}i.addEventListener('input',u);u();});
 q('physBtn').addEventListener('click',function(){var p=q('phys'),on=!p.classList.contains('on');p.classList.toggle('on',on);this.setAttribute('aria-expanded',on);});
 q('three').addEventListener('click',function(){if(mode==='three')orbitMode();else three();});
 q('shake').addEventListener('click',function(){bodies.forEach(function(b){if(!b.core){b.vx+=(Math.random()-.5)*1600;b.vy+=(Math.random()-.5)*1600;b.sq=.6;}});wake();});
 q('calm').addEventListener('click',function(){bodies.forEach(function(b){b.vx*=.1;b.vy*=.1;});});
 function step(dt){var B=bodies,n=B.length,i,j;dt=Math.min(dt,0.033);
  for(i=0;i<n;i++){var b=B[i];if(b.fixed||b===held)continue;var ax=0,ay=0;
   if(mode==='orbit'&&!b.core){var dx=cx-b.x,dy=cy-b.y,d2=dx*dx+dy*dy+1,d=Math.sqrt(d2);ax+=dx/d2*GM();ay+=dy/d2*GM();
    if(b.home){var err=d-b.home;ax+=dx/d*err*-2.2;ay+=dy/d*err*-2.2;ax+=-dy/d*P.s*40;ay+=dx/d*P.s*40;}}
   if(mode==='three'){for(j=0;j<n;j++){if(i===j)continue;var o=B[j],ox=o.x-b.x,oy=o.y-b.y,r2=ox*ox+oy*oy+25,r=Math.sqrt(r2),f=(window._G3||1)*o.m/r2;ax+=ox/r*f;ay+=oy/r*f;}}
   for(j=0;j<n;j++){if(i===j)continue;var o2=B[j],ox2=o2.x-b.x,oy2=o2.y-b.y,rr=Math.sqrt(ox2*ox2+oy2*oy2)+0.01,minR=b.r+o2.r;if(rr<minR){var push=(minR-rr)*2.8*P.a;ax-=ox2/rr*push;ay-=oy2/rr*push;b.vx*=(1-0.15*P.e);b.vy*=(1-0.15*P.e);}}
   b.vx=(b.vx+ax*dt)*(1-P.f*0.012);b.vy=(b.vy+ay*dt)*(1-P.f*0.012);
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*P.e;}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*P.e;}
   if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*P.e;}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*P.e;}
  }}
 function render(){bodies.forEach(function(b){b.el.style.transform='translate3d('+(b.x-b.r)+'px,'+(b.y-b.r)+'px,0)';});}
 function wake(){if(!run){run=true;last=performance.now();requestAnimationFrame(loop);}}
 function loop(now){if(!heroOn&&!body.classList.contains('open')){run=false;return;}var dt=(now-last)/1000;last=now;if(!RM)step(dt);render();requestAnimationFrame(loop);}
 addEventListener('resize',function(){W=hero.clientWidth;H=hero.clientHeight;cx=W/2;cy=H/2+20;if(!body.classList.contains('open')){core.x=cx;core.y=cy;}wake();});
 core.x=cx;core.y=cy;render();wake();
 // Auto-hint: pulse core once if idle
 setTimeout(function(){if(!body.classList.contains('open'))try{core.el.animate([{transform:core.el.style.transform,filter:'brightness(1)'},{filter:'brightness(1.35)'},{filter:'brightness(1)'}],{duration:900});}catch(e){}},1200);
})();
</script>
